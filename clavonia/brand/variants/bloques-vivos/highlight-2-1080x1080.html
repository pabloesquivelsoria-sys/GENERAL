<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clavonia destacado cómo funciona</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#2F5BFF;--yellow:#FFD23F;--ink:#111111;--white:#FFFFFF}
html,body{margin:0;padding:0;background:#2F5BFF}
.frame{width:1080px;height:1080px;position:relative;overflow:hidden;background:var(--blue)}
h1{position:absolute;left:0;right:0;top:250px;margin:0;text-align:center;font-family:"Archivo Black",Archivo,sans-serif;font-weight:400;font-size:132px;line-height:0.98;letter-spacing:-3px;color:var(--white)}
.steps{position:absolute;left:0;right:0;top:640px;display:flex;justify-content:center;gap:34px}
.steps div{width:180px;height:180px;background:var(--ink);color:var(--white);font-family:"Archivo Black",Archivo,sans-serif;font-size:110px;display:flex;align-items:center;justify-content:center;line-height:1}
</style>
</head>
<body>
<div class="frame">
  <h1>Cómo<br>funciona</h1>
  <div class="steps"><div>1</div><div>2</div><div>3</div></div>
</div>
</body>
</html>
