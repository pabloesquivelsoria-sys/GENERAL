<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clavonia anuncio 300x250</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#2F5BFF;--yellow:#FFD23F;--ink:#111111;--white:#FFFFFF}
html,body{margin:0;padding:0;background:#2F5BFF}
.frame{width:300px;height:250px;position:relative;overflow:hidden;background:var(--blue);font-family:Archivo,sans-serif;color:var(--white)}
.brand{position:absolute;left:20px;top:20px;display:flex;align-items:center;gap:8px}
.brand span{font-family:"Archivo Black",Archivo,sans-serif;font-size:22px;line-height:1}
h1{position:absolute;left:19px;top:64px;margin:0;font-family:"Archivo Black",Archivo,sans-serif;font-weight:400;font-size:32px;line-height:1;letter-spacing:-0.8px}
.cta{position:absolute;left:20px;top:182px;height:48px;padding:0 18px;background:var(--ink);color:var(--white);display:flex;align-items:center;font-size:17px;font-weight:800}
.d{position:absolute;background:var(--ink)}
</style>
</head>
<body>
<div class="frame">
  <div class="d" style="left:226px;top:64px;width:54px;height:62px"></div>
  <div class="d" style="left:226px;top:134px;width:54px;height:28px"></div>
  <div class="brand">
    <svg viewBox="0 0 64 64" width="28" height="28" role="img" aria-label="Clavonia"><rect x="4" y="4" width="50" height="14" fill="#FFFFFF"/><rect x="4" y="4" width="14" height="56" fill="#FFFFFF"/><rect x="4" y="46" width="50" height="14" fill="#FFFFFF"/><rect x="46" y="24" width="14" height="16" fill="#111111"/></svg>
    <span>clavonia</span>
  </div>
  <h1>Tu página,<br>lista en<br>minutos.</h1>
  <div class="cta">Crear mi página</div>
</div>
</body>
</html>
