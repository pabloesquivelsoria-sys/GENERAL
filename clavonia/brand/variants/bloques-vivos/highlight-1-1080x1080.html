<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clavonia destacado planes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#2F5BFF;--yellow:#FFD23F;--ink:#111111;--white:#FFFFFF}
html,body{margin:0;padding:0;background:#FFD23F}
.frame{width:1080px;height:1080px;position:relative;overflow:hidden;background:var(--yellow)}
.bar{position:absolute;left:50%;transform:translateX(-50%);height:76px;background:var(--ink);border-radius:14px}
.b1{top:250px;width:560px}
.b2{top:350px;width:420px}
.b3{top:450px;width:280px}
h1{position:absolute;left:0;right:0;top:600px;margin:0;text-align:center;font-family:"Archivo Black",Archivo,sans-serif;font-weight:400;font-size:176px;line-height:1;letter-spacing:-4px;color:var(--ink)}
</style>
</head>
<body>
<div class="frame">
  <div class="bar b1"></div>
  <div class="bar b2"></div>
  <div class="bar b3"></div>
  <h1>Planes</h1>
</div>
</body>
</html>
