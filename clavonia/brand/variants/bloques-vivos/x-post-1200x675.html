<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clavonia post X</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#2F5BFF;--yellow:#FFD23F;--ink:#111111;--white:#FFFFFF}
html,body{margin:0;padding:0;background:#111111}
.frame{width:1200px;height:675px;position:relative;overflow:hidden;background:var(--ink);font-family:Archivo,sans-serif;color:var(--white)}
.brand{position:absolute;left:64px;top:52px;display:flex;align-items:center;gap:14px}
.brand span{font-family:"Archivo Black",Archivo,sans-serif;font-size:40px;line-height:1;letter-spacing:-0.4px}
h1{position:absolute;left:62px;top:140px;margin:0;font-family:"Archivo Black",Archivo,sans-serif;font-weight:400;font-size:90px;line-height:0.98;letter-spacing:-2px}
p{position:absolute;left:64px;top:430px;margin:0;width:660px;font-size:28px;font-weight:500;line-height:1.35}
.cta{position:absolute;left:64px;top:548px;height:68px;padding:0 30px;background:var(--yellow);color:var(--ink);display:flex;align-items:center;font-family:"Archivo Black",Archivo,sans-serif;font-size:26px;letter-spacing:-0.3px}
.panel{position:absolute;left:840px;top:0;width:360px;height:675px;background:var(--yellow)}
.panel svg{position:absolute;left:90px;top:247px}
</style>
</head>
<body>
<div class="frame">
  <div class="brand">
    <svg viewBox="0 0 64 64" width="52" height="52" role="img" aria-label="Clavonia"><rect x="4" y="4" width="50" height="14" fill="#FFD23F"/><rect x="4" y="4" width="14" height="56" fill="#FFD23F"/><rect x="4" y="46" width="50" height="14" fill="#FFD23F"/><rect x="46" y="24" width="14" height="16" fill="#FFFFFF"/></svg>
    <span>clavonia</span>
  </div>
  <h1>Tu página,<br>lista en<br>minutos.</h1>
  <p>Elige una plantilla, edita por bloques y publica cuando quieras.</p>
  <div class="cta">Crear mi página</div>
  <div class="panel">
    <svg viewBox="0 0 64 64" width="180" height="180" aria-hidden="true"><rect x="4" y="4" width="50" height="14" fill="#111111"/><rect x="4" y="4" width="14" height="56" fill="#111111"/><rect x="4" y="46" width="50" height="14" fill="#111111"/><rect x="46" y="24" width="14" height="16" fill="#111111"/></svg>
  </div>
</div>
</body>
</html>
