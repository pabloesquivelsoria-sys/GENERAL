<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clavonia anuncio 336x280</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#2F5BFF;--yellow:#FFD23F;--ink:#111111;--white:#FFFFFF}
html,body{margin:0;padding:0;background:#FFD23F}
.frame{width:336px;height:280px;position:relative;overflow:hidden;background:var(--yellow);font-family:Archivo,sans-serif;color:var(--ink)}
.brand{position:absolute;left:22px;top:22px;display:flex;align-items:center;gap:8px}
.brand span{font-family:"Archivo Black",Archivo,sans-serif;font-size:24px;line-height:1}
h1{position:absolute;left:21px;top:70px;margin:0;font-family:"Archivo Black",Archivo,sans-serif;font-weight:400;font-size:36px;line-height:1;letter-spacing:-0.9px}
.cta{position:absolute;left:22px;top:206px;height:52px;padding:0 20px;background:var(--ink);color:var(--yellow);display:flex;align-items:center;font-size:18px;font-weight:800}
.d{position:absolute;background:var(--blue)}
</style>
</head>
<body>
<div class="frame">
  <div class="d" style="left:252px;top:70px;width:62px;height:70px"></div>
  <div class="d" style="left:252px;top:150px;width:62px;height:30px"></div>
  <div class="d" style="left:276px;top:206px;width:38px;height:52px"></div>
  <div class="brand">
    <svg viewBox="0 0 64 64" width="32" height="32" role="img" aria-label="Clavonia"><rect x="4" y="4" width="50" height="14" fill="#111111"/><rect x="4" y="4" width="14" height="56" fill="#111111"/><rect x="4" y="46" width="50" height="14" fill="#111111"/><rect x="46" y="24" width="14" height="16" fill="#2F5BFF"/></svg>
    <span>clavonia</span>
  </div>
  <h1>Tu página,<br>lista en<br>minutos.</h1>
  <div class="cta">Crear mi página</div>
</div>
</body>
</html>
