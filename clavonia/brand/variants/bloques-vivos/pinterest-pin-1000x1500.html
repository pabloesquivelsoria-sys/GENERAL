<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clavonia pin Pinterest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#2F5BFF;--yellow:#FFD23F;--ink:#111111;--white:#FFFFFF}
html,body{margin:0;padding:0;background:#2F5BFF}
.frame{width:1000px;height:1500px;position:relative;overflow:hidden;background:var(--blue);font-family:Archivo,sans-serif;color:var(--white)}
.brand{position:absolute;left:80px;top:72px;display:flex;align-items:center;gap:14px}
.brand span{font-family:"Archivo Black",Archivo,sans-serif;font-size:44px;line-height:1;letter-spacing:-0.4px}
h1{position:absolute;left:76px;top:172px;margin:0;font-family:"Archivo Black",Archivo,sans-serif;font-weight:400;font-size:118px;line-height:0.97;letter-spacing:-3px}
/* Visual: una página armada con bloques */
.page{position:absolute;left:80px;top:560px;width:840px;height:560px;background:var(--white);padding:32px;box-sizing:border-box}
.page i{position:absolute;display:block}
p{position:absolute;left:80px;top:1158px;margin:0;width:840px;font-size:32px;font-weight:700;line-height:1.3}
.cta{position:absolute;left:80px;top:1300px;height:110px;padding:0 48px;background:var(--ink);color:var(--white);display:flex;align-items:center;font-family:"Archivo Black",Archivo,sans-serif;font-size:40px;letter-spacing:-0.5px}
</style>
</head>
<body>
<div class="frame">
  <div class="brand">
    <svg viewBox="0 0 64 64" width="56" height="56" role="img" aria-label="Clavonia"><rect x="4" y="4" width="50" height="14" fill="#FFFFFF"/><rect x="4" y="4" width="14" height="56" fill="#FFFFFF"/><rect x="4" y="46" width="50" height="14" fill="#FFFFFF"/><rect x="46" y="24" width="14" height="16" fill="#111111"/></svg>
    <span>clavonia</span>
  </div>
  <h1>Tu página,<br>lista en<br>minutos.</h1>
  <div class="page" aria-hidden="true">
    <i style="left:32px;top:32px;width:776px;height:56px;background:#111111"></i>
    <i style="left:32px;top:108px;width:776px;height:210px;background:#2F5BFF"></i>
    <i style="left:72px;top:150px;width:420px;height:44px;background:#FFFFFF"></i>
    <i style="left:72px;top:212px;width:300px;height:24px;background:#FFFFFF"></i>
    <i style="left:72px;top:254px;width:160px;height:36px;background:#111111"></i>
    <i style="left:32px;top:338px;width:378px;height:190px;background:#111111"></i>
    <i style="left:430px;top:338px;width:378px;height:190px;background:#2F5BFF"></i>
    <i style="left:740px;top:150px;width:28px;height:60px;background:#111111"></i>
  </div>
  <p>Elige una plantilla, edita por bloques y publica cuando quieras.</p>
  <div class="cta">Crear mi página</div>
</div>
</body>
</html>
