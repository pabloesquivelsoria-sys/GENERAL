<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clavonia portada TikTok</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#2F5BFF;--yellow:#FFD23F;--ink:#111111;--white:#FFFFFF}
html,body{margin:0;padding:0;background:#FFD23F}
.frame{width:1080px;height:1920px;position:relative;overflow:hidden;background:var(--yellow);font-family:Archivo,sans-serif;color:var(--ink)}
/* Texto en la parte media-alta: libre de los 120 px de la derecha y los 400 px de abajo */
.brand{position:absolute;left:72px;top:300px;display:flex;align-items:center;gap:16px}
.brand span{font-family:"Archivo Black",Archivo,sans-serif;font-size:64px;line-height:1;letter-spacing:-0.6px}
h1{position:absolute;left:68px;top:450px;margin:0;font-family:"Archivo Black",Archivo,sans-serif;font-weight:400;font-size:140px;line-height:0.97;letter-spacing:-3px}
p{position:absolute;left:72px;top:900px;margin:0;width:800px;font-size:46px;font-weight:700;line-height:1.25}
.cta{position:absolute;left:72px;top:1150px;height:120px;padding:0 56px;background:var(--ink);color:var(--yellow);display:flex;align-items:center;font-family:"Archivo Black",Archivo,sans-serif;font-size:50px;letter-spacing:-0.5px}
.d{position:absolute;background:var(--blue)}
</style>
</head>
<body>
<div class="frame">
  <div class="d" style="left:0;top:1560px;width:1080px;height:360px"></div>
  <div class="d" style="left:960px;top:0;width:120px;height:1540px"></div>
  <div class="d" style="left:0;top:0;width:420px;height:140px"></div>
  <div class="brand">
    <svg viewBox="0 0 64 64" width="84" height="84" role="img" aria-label="Clavonia"><rect x="4" y="4" width="50" height="14" fill="#111111"/><rect x="4" y="4" width="14" height="56" fill="#111111"/><rect x="4" y="46" width="50" height="14" fill="#111111"/><rect x="46" y="24" width="14" height="16" fill="#2F5BFF"/></svg>
    <span>clavonia</span>
  </div>
  <h1>Tu página,<br>lista en<br>minutos.</h1>
  <p>Elige una plantilla, edita por bloques y publica cuando quieras.</p>
  <div class="cta">Empieza hoy</div>
</div>
</body>
</html>
