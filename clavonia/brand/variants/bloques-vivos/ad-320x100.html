<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clavonia anuncio 320x100</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#2F5BFF;--yellow:#FFD23F;--ink:#111111;--white:#FFFFFF}
html,body{margin:0;padding:0;background:#2F5BFF}
.frame{width:320px;height:100px;position:relative;overflow:hidden;background:var(--blue);font-family:Archivo,sans-serif;color:var(--white)}
.mark{position:absolute;left:12px;top:30px}
h1{position:absolute;left:62px;top:20px;margin:0;font-family:"Archivo Black",Archivo,sans-serif;font-weight:400;font-size:19px;line-height:1.03;letter-spacing:-0.3px}
.cta{position:absolute;right:12px;top:28px;height:44px;padding:0 14px;background:var(--white);color:var(--blue);display:flex;align-items:center;font-size:15px;font-weight:800}
</style>
</head>
<body>
<div class="frame">
  <svg class="mark" viewBox="0 0 64 64" width="40" height="40" role="img" aria-label="Clavonia"><rect x="4" y="4" width="50" height="14" fill="#FFFFFF"/><rect x="4" y="4" width="14" height="56" fill="#FFFFFF"/><rect x="4" y="46" width="50" height="14" fill="#FFFFFF"/><rect x="46" y="24" width="14" height="16" fill="#FFFFFF"/></svg>
  <h1>Tu página,<br>lista en<br>minutos.</h1>
  <div class="cta">Empieza hoy</div>
</div>
</body>
</html>
