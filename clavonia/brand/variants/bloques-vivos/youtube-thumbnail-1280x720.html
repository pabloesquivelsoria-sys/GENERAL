<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clavonia miniatura YouTube</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#2F5BFF;--yellow:#FFD23F;--ink:#111111;--white:#FFFFFF}
html,body{margin:0;padding:0;background:#FFD23F}
.frame{width:1280px;height:720px;position:relative;overflow:hidden;background:var(--yellow);font-family:Archivo,sans-serif;color:var(--ink)}
h1{position:absolute;left:60px;top:70px;margin:0;font-family:"Archivo Black",Archivo,sans-serif;font-weight:400;font-size:132px;line-height:1;letter-spacing:-3px}
h1 .hi{display:inline-block;margin-top:14px;padding:4px 24px 14px;background:var(--ink);color:var(--yellow)}
.mark{position:absolute;left:850px;top:150px}
.wm{position:absolute;left:62px;top:612px;display:flex;align-items:center;gap:12px}
.wm span{font-family:"Archivo Black",Archivo,sans-serif;font-size:40px;line-height:1}
</style>
</head>
<body>
<div class="frame">
  <h1>Tu página,<br>lista en<br><span class="hi">minutos.</span></h1>
  <svg class="mark" viewBox="0 0 64 64" width="360" height="360" aria-hidden="true"><rect x="4" y="4" width="50" height="14" fill="#2F5BFF"/><rect x="4" y="4" width="14" height="56" fill="#2F5BFF"/><rect x="4" y="46" width="50" height="14" fill="#2F5BFF"/><rect x="46" y="24" width="14" height="16" fill="#111111"/></svg>
  <div class="wm">
    <svg viewBox="0 0 64 64" width="44" height="44" role="img" aria-label="Clavonia"><rect x="4" y="4" width="50" height="14" fill="#111111"/><rect x="4" y="4" width="14" height="56" fill="#111111"/><rect x="4" y="46" width="50" height="14" fill="#111111"/><rect x="46" y="24" width="14" height="16" fill="#2F5BFF"/></svg>
    <span>clavonia</span>
  </div>
</div>
</body>
</html>
