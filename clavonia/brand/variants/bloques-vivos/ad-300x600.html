<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clavonia anuncio 300x600</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#2F5BFF;--yellow:#FFD23F;--ink:#111111;--white:#FFFFFF}
html,body{margin:0;padding:0;background:#111111}
.frame{width:300px;height:600px;position:relative;overflow:hidden;background:var(--ink);font-family:Archivo,sans-serif;color:var(--white)}
.brand{position:absolute;left:24px;top:28px;display:flex;align-items:center;gap:10px}
.brand span{font-family:"Archivo Black",Archivo,sans-serif;font-size:28px;line-height:1}
h1{position:absolute;left:23px;top:96px;margin:0;font-family:"Archivo Black",Archivo,sans-serif;font-weight:400;font-size:46px;line-height:1;letter-spacing:-1.2px}
.b{position:absolute;background:var(--yellow)}
.cta{position:absolute;left:24px;top:516px;width:252px;height:56px;background:var(--yellow);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800}
</style>
</head>
<body>
<div class="frame">
  <div class="brand">
    <svg viewBox="0 0 64 64" width="36" height="36" role="img" aria-label="Clavonia"><rect x="4" y="4" width="50" height="14" fill="#FFD23F"/><rect x="4" y="4" width="14" height="56" fill="#FFD23F"/><rect x="4" y="46" width="50" height="14" fill="#FFD23F"/><rect x="46" y="24" width="14" height="16" fill="#FFFFFF"/></svg>
    <span>clavonia</span>
  </div>
  <h1>Tu página,<br>lista en<br>minutos.</h1>
  <div class="b" style="left:24px;top:282px;width:252px;height:96px"></div>
  <div class="b" style="left:24px;top:390px;width:120px;height:96px"></div>
  <div class="b" style="left:156px;top:390px;width:120px;height:96px;background:#FFFFFF"></div>
  <div class="cta">Crear mi página</div>
</div>
</body>
</html>
