<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clavonia portada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#2F5BFF;--yellow:#FFD23F;--ink:#111111;--white:#FFFFFF}
html,body{margin:0;padding:0;background:#FFFFFF}
.frame{width:1640px;height:624px;position:relative;overflow:hidden;background:var(--white)}
.brand{position:absolute;left:170px;top:92px;display:flex;align-items:center;gap:18px}
.brand svg{width:72px;height:72px;display:block}
.brand span{font-family:"Archivo Black",Archivo,sans-serif;font-size:50px;color:var(--ink);letter-spacing:-0.5px;line-height:1}
h1{position:absolute;left:166px;top:196px;margin:0;font-family:"Archivo Black",Archivo,sans-serif;font-weight:400;font-size:98px;line-height:1;letter-spacing:-2px;color:var(--ink)}
h1 em{font-style:normal;color:var(--blue)}
p{position:absolute;left:170px;top:470px;margin:0;width:800px;font-family:Archivo,sans-serif;font-weight:500;font-size:34px;line-height:1.3;color:var(--ink)}
.stack{position:absolute;left:1072px;top:0;width:520px;height:624px}
.b{position:absolute}
.b1{left:0;top:72px;width:430px;height:190px;background:var(--blue)}
.b2{left:0;top:282px;width:206px;height:142px;background:var(--ink)}
.b3{left:224px;top:282px;width:206px;height:142px;background:var(--blue)}
.b4{left:0;top:444px;width:430px;height:108px;background:var(--ink)}
.b5{left:448px;top:72px;width:60px;height:320px;background:var(--ink)}
.cur{left:452px;top:444px;width:56px;height:108px;background:var(--blue)}
</style>
</head>
<body>
<div class="frame">
  <div class="brand">
    <svg viewBox="0 0 64 64" role="img" aria-label="Clavonia">
      <rect x="4" y="4" width="50" height="14" fill="#111111"/>
      <rect x="4" y="4" width="14" height="56" fill="#111111"/>
      <rect x="4" y="46" width="50" height="14" fill="#111111"/>
      <rect x="46" y="24" width="14" height="16" fill="#2F5BFF"/>
    </svg>
    <span>clavonia</span>
  </div>
  <h1>Tu página,<br>lista <em>en minutos.</em></h1>
  <p>Elige una plantilla, edita por bloques y publica cuando quieras.</p>
  <div class="stack">
    <div class="b b1"></div>
    <div class="b b2"></div>
    <div class="b b3"></div>
    <div class="b b4"></div>
    <div class="b b5"></div>
  </div>
</div>
</body>
</html>
