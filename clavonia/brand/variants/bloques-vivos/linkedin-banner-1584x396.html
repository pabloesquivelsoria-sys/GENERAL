<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clavonia banner LinkedIn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#2F5BFF;--yellow:#FFD23F;--ink:#111111;--white:#FFFFFF}
html,body{margin:0;padding:0;background:#FFFFFF}
.frame{width:1584px;height:396px;position:relative;overflow:hidden;background:var(--white);font-family:Archivo,sans-serif;color:var(--ink)}
/* La foto de perfil cubre ~400 px a la izquierda: solo decoración ahí */
.left{position:absolute;left:0;top:0;width:400px;height:396px;background:var(--blue)}
.left i{position:absolute;display:block;background:var(--ink)}
h1{position:absolute;left:470px;top:84px;margin:0;font-family:"Archivo Black",Archivo,sans-serif;font-weight:400;font-size:64px;line-height:1;letter-spacing:-1.5px}
h1 em{font-style:normal;color:var(--blue)}
p{position:absolute;left:472px;top:236px;margin:0;width:620px;font-size:24px;font-weight:500;line-height:1.35}
.sq{position:absolute;left:1236px;top:64px;width:268px;height:268px;background:var(--blue)}
.sq svg{position:absolute;left:54px;top:54px}
.bar{position:absolute;left:1524px;top:64px;width:60px;height:268px;background:var(--ink)}
</style>
</head>
<body>
<div class="frame">
  <div class="left"><i style="left:0;top:0;width:180px;height:90px"></i><i style="left:220px;top:300px;width:180px;height:96px"></i></div>
  <h1>Tu página,<br>lista <em>en minutos.</em></h1>
  <p>Elige una plantilla, edita por bloques y publica cuando quieras.</p>
  <div class="sq">
    <svg viewBox="0 0 64 64" width="160" height="160" role="img" aria-label="Clavonia"><rect x="4" y="4" width="50" height="14" fill="#FFFFFF"/><rect x="4" y="4" width="14" height="56" fill="#FFFFFF"/><rect x="4" y="46" width="50" height="14" fill="#FFFFFF"/><rect x="46" y="24" width="14" height="16" fill="#111111"/></svg>
  </div>
  <div class="bar"></div>
</div>
</body>
</html>
