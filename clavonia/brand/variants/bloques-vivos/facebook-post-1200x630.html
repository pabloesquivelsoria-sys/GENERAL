<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clavonia enlace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#2F5BFF;--yellow:#FFD23F;--ink:#111111;--white:#FFFFFF}
html,body{margin:0;padding:0;background:#111111}
.frame{width:1200px;height:630px;position:relative;overflow:hidden;background:var(--ink)}
.brand{position:absolute;left:64px;top:52px;display:flex;align-items:center;gap:14px}
.brand svg{width:54px;height:54px;display:block}
.brand span{font-family:"Archivo Black",Archivo,sans-serif;font-size:40px;color:var(--white);line-height:1;letter-spacing:-0.4px}
h1{position:absolute;left:64px;top:150px;margin:0;width:700px;font-family:"Archivo Black",Archivo,sans-serif;font-weight:400;font-size:88px;line-height:1;letter-spacing:-1.5px;color:var(--white)}
h1 em{font-style:normal;color:var(--yellow)}
p{position:absolute;left:66px;top:440px;margin:0;width:640px;font-family:Archivo,sans-serif;font-weight:500;font-size:28px;line-height:1.35;color:var(--white)}
.panel{position:absolute;left:830px;top:0;width:370px;height:630px;background:var(--yellow)}
.panel svg{position:absolute;left:105px;top:165px;width:160px;height:160px}
</style>
</head>
<body>
<div class="frame">
  <div class="brand">
    <svg viewBox="0 0 64 64" role="img" aria-label="Clavonia">
      <rect x="4" y="4" width="50" height="14" fill="#FFD23F"/>
      <rect x="4" y="4" width="14" height="56" fill="#FFD23F"/>
      <rect x="4" y="46" width="50" height="14" fill="#FFD23F"/>
      <rect x="46" y="24" width="14" height="16" fill="#FFFFFF"/>
    </svg>
    <span>clavonia</span>
  </div>
  <h1>Tu página, lista <em>en minutos.</em></h1>
  <p>Elige una plantilla, edita por bloques y publica cuando quieras.</p>
  <div class="panel">
    <svg viewBox="0 0 64 64" role="img" aria-label="">
      <rect x="4" y="4" width="50" height="14" fill="#111111"/>
      <rect x="4" y="4" width="14" height="56" fill="#111111"/>
      <rect x="4" y="46" width="50" height="14" fill="#111111"/>
      <rect x="46" y="24" width="14" height="16" fill="#111111"/>
    </svg>
  </div>
</div>
</body>
</html>
