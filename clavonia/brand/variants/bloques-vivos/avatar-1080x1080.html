<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clavonia avatar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#2F5BFF;--yellow:#FFD23F;--ink:#111111;--white:#FFFFFF}
html,body{margin:0;padding:0;background:#2F5BFF}
.frame{width:1080px;height:1080px;position:relative;overflow:hidden;background:var(--blue)}
.mark{position:absolute;left:190px;top:190px;width:700px;height:700px}
</style>
</head>
<body>
<div class="frame">
  <svg class="mark" viewBox="0 0 64 64" role="img" aria-label="Clavonia">
    <rect x="4" y="4" width="50" height="14" fill="#FFD23F"/>
    <rect x="4" y="4" width="14" height="56" fill="#FFD23F"/>
    <rect x="4" y="46" width="50" height="14" fill="#FFD23F"/>
    <rect x="46" y="24" width="14" height="16" fill="#111111"/>
  </svg>
</div>
</body>
</html>
