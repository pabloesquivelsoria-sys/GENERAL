<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clavonia encabezado X</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#2F5BFF;--yellow:#FFD23F;--ink:#111111;--white:#FFFFFF}
html,body{margin:0;padding:0;background:#2F5BFF}
.frame{width:1500px;height:500px;position:relative;overflow:hidden;background:var(--blue);font-family:Archivo,sans-serif;color:var(--white)}
/* Texto dentro del 80% central y lejos de la esquina inferior izquierda (avatar) */
.content{position:absolute;left:150px;width:1200px;top:92px;display:flex;flex-direction:column;align-items:center;text-align:center}
.brand{display:flex;align-items:center;gap:14px}
.brand span{font-family:"Archivo Black",Archivo,sans-serif;font-size:42px;line-height:1;letter-spacing:-0.4px}
h1{margin:30px 0 0;font-family:"Archivo Black",Archivo,sans-serif;font-weight:400;font-size:70px;line-height:1;letter-spacing:-1.5px}
p{margin:22px 0 0;font-size:26px;font-weight:500;line-height:1.3}
.d{position:absolute;background:var(--ink)}
</style>
</head>
<body>
<div class="frame">
  <div class="d" style="left:0;top:0;width:110px;height:180px"></div>
  <div class="d" style="left:0;top:200px;width:60px;height:300px"></div>
  <div class="d" style="left:1400px;top:0;width:100px;height:300px"></div>
  <div class="d" style="left:1400px;top:320px;width:100px;height:180px"></div>
  <div class="d" style="left:1340px;top:420px;width:40px;height:80px"></div>
  <div class="content">
    <div class="brand">
      <svg viewBox="0 0 64 64" width="54" height="54" role="img" aria-label="Clavonia"><rect x="4" y="4" width="50" height="14" fill="#FFFFFF"/><rect x="4" y="4" width="14" height="56" fill="#FFFFFF"/><rect x="4" y="46" width="50" height="14" fill="#FFFFFF"/><rect x="46" y="24" width="14" height="16" fill="#111111"/></svg>
      <span>clavonia</span>
    </div>
    <h1>Tu página, lista en minutos.</h1>
    <p>Elige una plantilla, edita por bloques y publica cuando quieras.</p>
  </div>
</div>
</body>
</html>
