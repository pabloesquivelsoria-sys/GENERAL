<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clavonia anuncio 728x90</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#2F5BFF;--yellow:#FFD23F;--ink:#111111;--white:#FFFFFF}
html,body{margin:0;padding:0;background:#FFFFFF}
.frame{width:728px;height:90px;position:relative;overflow:hidden;background:var(--white);box-shadow:inset 0 0 0 2px var(--ink);font-family:Archivo,sans-serif;color:var(--ink)}
.brand{position:absolute;left:20px;top:0;height:90px;display:flex;align-items:center;gap:10px}
.brand span{font-family:"Archivo Black",Archivo,sans-serif;font-size:26px;line-height:1}
h1{position:absolute;left:226px;top:17px;margin:0;font-family:"Archivo Black",Archivo,sans-serif;font-weight:400;font-size:26px;line-height:1.08;letter-spacing:-0.5px}
.cta{position:absolute;right:20px;top:21px;height:48px;padding:0 22px;background:var(--blue);color:var(--white);display:flex;align-items:center;font-size:18px;font-weight:800}
.sep{position:absolute;left:200px;top:20px;width:4px;height:50px;background:var(--ink)}
</style>
</head>
<body>
<div class="frame">
  <div class="brand">
    <svg viewBox="0 0 64 64" width="40" height="40" role="img" aria-label="Clavonia"><rect x="4" y="4" width="50" height="14" fill="#111111"/><rect x="4" y="4" width="14" height="56" fill="#111111"/><rect x="4" y="46" width="50" height="14" fill="#111111"/><rect x="46" y="24" width="14" height="16" fill="#2F5BFF"/></svg>
    <span>clavonia</span>
  </div>
  <div class="sep"></div>
  <h1>Tu página, lista<br>en minutos.</h1>
  <div class="cta">Crear mi página</div>
</div>
</body>
</html>
