<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<style>

.brand span{font-family:"Archivo Black",Archivo,sans-serif;font-size:44px;line-height:1;letter-spacing:-0.4px}
.sep{width:6px;height:80px;background:var(--ink)}
h1{margin:0;font-family:"Archivo Black",Archivo,sans-serif;font-weight:400;font-size:32px;line-height:1;letter-spacing:-0.5px}
.d{position:absolute;background:var(--blue)}
</style>
</head>
<body>
<div class="frame">
  <div class="d" style="left:0;top:0;width:120px;height:60px"></div>
  <div class="d" style="left:1068px;top:0;width:60px;height:191px"></div>
  <div class="d" style="left:1000px;top:131px;width:48px;height:60px"></div>
  <div class="row">
    <div class="brand">
      <svg viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Clavonia"><rect x="4" y="4" width="50" height="14" fill="#111111"/><rect x="4" y="4" width="14" height="56" fill="#111111"/><rect x="4" y="46" width="50" height="14" fill="#111111"/><rect x="46" y="24" width="14" height="16" fill="#2F5BFF"/></svg>

  </div>
</div>

</html>
