<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clavonia post X</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0B0F14;--panel:#151B23;--panel2:#10161E;--line:#263142;--cyan:#38BDF8;--lilac:#C4B5FD;--text:#E6EDF3;--muted:#8B98A9}
html,body{background:#0B0F14;color:#E6EDF3}
body{overflow:hidden}
.canvas{position:relative;overflow:hidden;background:var(--bg);font-family:'Sora',system-ui,sans-serif;color:var(--text)}
.abs{position:absolute}
.lbl,.bar,.rail,.chip,.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.lbl{color:var(--lilac)}
.muted{color:var(--muted)}
.h{font-weight:700;letter-spacing:-.03em;line-height:1.04}
.sub{color:var(--muted);font-weight:400;line-height:1.45;text-wrap:balance}
.caret{display:inline-block;width:.09em;height:.86em;background:var(--cyan);margin-left:.05em;vertical-align:-.04em}
.wm{display:flex;align-items:center;font-weight:700;letter-spacing:-.03em;color:var(--text);white-space:nowrap}
.win{position:relative;background:var(--panel);border:2px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:10px;background:var(--panel2);border-bottom:2px solid var(--line);color:var(--muted);white-space:nowrap;flex:none}
.dot{display:block;border-radius:50%;background:#3A4658;flex:none}
.ws{display:flex;flex:1;min-height:0}
.rail{background:var(--panel2);border-right:2px solid var(--line);color:var(--muted);white-space:nowrap;flex:none}
.rail>div{position:relative}
.rail .on{color:var(--text);background:var(--panel)}
.rail .on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--cyan)}
.page{flex:1;position:relative;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;background:var(--cyan);color:var(--bg);font-weight:600;border-radius:12px;white-space:nowrap;min-height:44px}
.ph{background:var(--panel2);border-radius:8px}
.chip{background:var(--panel);border:2px solid var(--line);border-radius:14px;color:var(--text);display:flex;gap:14px;align-items:center;white-space:nowrap}
.mk{display:block;flex:none}
</style>
</head>
<body>
<div class="canvas" style="width:1200px;height:675px">

<div class="abs" style="left:72px;top:142px;width:580px">
  <div class="wm" style="font-size:36px;gap:14px"><svg class="mk" width="56" height="56" viewBox="0 0 64 64" aria-hidden="true"><rect x="2" y="2" width="60" height="60" rx="14" fill="#151B23" stroke="#263142" stroke-width="2"/><rect x="14" y="14" width="30" height="8" rx="3" fill="#E6EDF3"/><rect x="14" y="14" width="8" height="36" rx="3" fill="#E6EDF3"/><rect x="14" y="42" width="30" height="8" rx="3" fill="#E6EDF3"/><rect x="44" y="24" width="6" height="16" rx="2" fill="#38BDF8"/></svg><span>clavonia</span></div>
  <h1 class="h" style="font-size:58px;margin-top:34px">Tu página,<br>lista en minutos.<span class="caret"></span></h1>
  <p class="sub" style="font-size:24px;margin-top:22px;width:520px">Elige una plantilla, edita por bloques y publica cuando quieras.</p>
  <div style="margin-top:32px"><span class="btn" style="font-size:21px;height:56px;padding:0 28px">Crear mi página</span></div>
</div>
<div class="abs" style="left:688px;top:193px"><div style="width:440px;height:289px;position:relative"><div class="win" style="width:640px;height:420px;transform:scale(0.68750);transform-origin:0 0">
  <div class="bar" style="height:44px;padding:0 18px;font-size:15px"><i class="dot" style="width:12px;height:12px"></i><i class="dot" style="width:12px;height:12px"></i><i class="dot" style="width:12px;height:12px"></i><span style="margin-left:8px">editor / inicio</span></div>
  <div class="ws">
    <div class="rail" style="width:150px;font-size:15px;padding-top:8px">
      <div class="on" style="padding:13px 16px">encabezado</div>
      <div style="padding:13px 16px">texto</div>
      <div style="padding:13px 16px">imagen</div>
      <div style="padding:13px 16px">contacto</div>
    </div>
    <div class="page" style="padding:32px 30px">
      <div class="lbl" style="font-size:15px">bloque 01</div>
      <div class="h" style="font-size:40px;margin-top:14px">Tu negocio aquí<span class="caret"></span></div>
      <div class="sub" style="font-size:17px;margin-top:14px">Edita este bloque y publica cuando quieras.</div>
      <div style="height:40px;width:150px;margin-top:24px;background:#263142;border-radius:10px"></div>
      <div class="ph" style="height:22px;margin-top:26px"></div>
      <div class="ph" style="height:22px;margin-top:10px;width:70%"></div>
    </div>
  </div>
</div></div></div>

</div>
</body>
</html>
