<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clavonia anuncio 300x600</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0B0F14;--panel:#151B23;--panel2:#10161E;--line:#263142;--cyan:#38BDF8;--lilac:#C4B5FD;--text:#E6EDF3;--muted:#8B98A9}
html,body{background:#0B0F14;color:#E6EDF3}
body{overflow:hidden}
.canvas{position:relative;overflow:hidden;background:var(--bg);font-family:'Sora',system-ui,sans-serif;color:var(--text)}
.abs{position:absolute}
.lbl,.bar,.rail,.chip,.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.lbl{color:var(--lilac)}
.muted{color:var(--muted)}
.h{font-weight:700;letter-spacing:-.03em;line-height:1.04}
.sub{color:var(--muted);font-weight:400;line-height:1.45;text-wrap:balance}
.caret{display:inline-block;width:.09em;height:.86em;background:var(--cyan);margin-left:.05em;vertical-align:-.04em}
.wm{display:flex;align-items:center;font-weight:700;letter-spacing:-.03em;color:var(--text);white-space:nowrap}
.win{position:relative;background:var(--panel);border:2px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:10px;background:var(--panel2);border-bottom:2px solid var(--line);color:var(--muted);white-space:nowrap;flex:none}
.dot{display:block;border-radius:50%;background:#3A4658;flex:none}
.ws{display:flex;flex:1;min-height:0}
.rail{background:var(--panel2);border-right:2px solid var(--line);color:var(--muted);white-space:nowrap;flex:none}
.rail>div{position:relative}
.rail .on{color:var(--text);background:var(--panel)}
.rail .on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--cyan)}
.page{flex:1;position:relative;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;background:var(--cyan);color:var(--bg);font-weight:600;border-radius:12px;white-space:nowrap;min-height:44px}
.ph{background:var(--panel2);border-radius:8px}
.chip{background:var(--panel);border:2px solid var(--line);border-radius:14px;color:var(--text);display:flex;gap:14px;align-items:center;white-space:nowrap}
.mk{display:block;flex:none}
</style>
</head>
<body>
<div class="canvas" style="width:300px;height:600px">

<div class="abs" style="left:24px;top:26px"><div class="wm" style="font-size:24px;gap:10px"><svg class="mk" width="36" height="36" viewBox="0 0 64 64" aria-hidden="true"><rect x="2" y="2" width="60" height="60" rx="14" fill="#151B23" stroke="#263142" stroke-width="2"/><rect x="14" y="14" width="30" height="8" rx="3" fill="#E6EDF3"/><rect x="14" y="14" width="8" height="36" rx="3" fill="#E6EDF3"/><rect x="14" y="42" width="30" height="8" rx="3" fill="#E6EDF3"/><rect x="44" y="24" width="6" height="16" rx="2" fill="#38BDF8"/></svg><span>clavonia</span></div></div>
<div class="abs h" style="left:24px;top:96px;width:252px;font-size:38px">Tu página,<br>lista en<br>minutos.<span class="caret"></span></div>
<div class="abs" style="left:24px;top:260px"><div class="win" style="width:252px;height:220px;border-radius:20px">
  <div class="bar" style="height:33px;padding-left:18px;gap:11px"><i class="dot" style="width:12px;height:12px"></i><i class="dot" style="width:12px;height:12px"></i><i class="dot" style="width:12px;height:12px"></i></div>
  <div class="ws">
    <div class="rail" style="width:68px;padding-top:18px">
      <div style="height:24px;background:#151B23;border-left:3px solid #38BDF8"></div>
      <div style="height:24px;margin:12px 9px 0;background:#263142;border-radius:2px"></div>
      <div style="height:24px;margin:12px 9px 0;background:#263142;border-radius:2px"></div>
    </div>
    <div style="flex:1;padding:18px;min-width:0">
      <div style="display:flex;align-items:center;gap:3px"><div style="height:24px;width:72%;background:#E6EDF3;border-radius:2px"></div><div style="height:30px;width:3px;background:#38BDF8"></div></div>
      <div style="height:12px;width:90%;background:#3A4658;border-radius:2px;margin-top:24px"></div>
      <div style="height:12px;width:66%;background:#3A4658;border-radius:2px;margin-top:12px"></div>
      <div style="height:26px;width:44%;background:#263142;border-radius:3px;margin-top:24px"></div>
    </div>
  </div>
</div></div>
<div class="abs" style="left:24px;top:516px;width:252px"><span class="btn" style="font-size:18px;height:52px;padding:0;width:252px">Crear mi página</span></div>

</div>
</body>
</html>
