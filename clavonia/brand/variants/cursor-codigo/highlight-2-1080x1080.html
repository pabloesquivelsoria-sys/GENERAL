<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clavonia destacado Cómo funciona</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0B0F14;--panel:#151B23;--panel2:#10161E;--line:#263142;--cyan:#38BDF8;--lilac:#C4B5FD;--text:#E6EDF3;--muted:#8B98A9}
html,body{background:#0B0F14;color:#E6EDF3}
body{overflow:hidden}
.canvas{position:relative;overflow:hidden;background:var(--bg);font-family:'Sora',system-ui,sans-serif;color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.lbl,.num{font-family:'JetBrains Mono',ui-monospace,monospace}
.lbl{color:var(--lilac);font-size:38px}
.h{font-weight:700;letter-spacing:-.04em;line-height:1.02;font-size:118px;margin-top:22px}
.steps{display:flex;flex-direction:column;gap:20px;margin-top:60px;width:560px;text-align:left}
.step{display:flex;align-items:center;gap:22px;height:86px;padding:0 26px;background:var(--panel);border:2px solid var(--line);border-radius:18px;font-size:32px;font-weight:600;position:relative}
.num{color:var(--lilac);font-size:28px;font-weight:500}
.step.on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--cyan);border-radius:18px 0 0 18px}
</style>
</head>
<body>
<div class="canvas" style="width:1080px;height:1080px">
  <div class="lbl">// tres pasos</div>
  <h1 class="h">Cómo<br>funciona</h1>
  <div class="steps">
    <div class="step on"><span class="num">01</span>Elige una plantilla</div>
    <div class="step"><span class="num">02</span>Edita por bloques</div>
    <div class="step"><span class="num">03</span>Publica cuando quieras</div>
  </div>
</div>
</body>
</html>
