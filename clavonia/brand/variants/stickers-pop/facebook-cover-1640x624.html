<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>clavonia portada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700..800&family=Figtree:wght@500..800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1B1464;--pink:#FF5C8A;--butter:#FFE66D;--mint:#2BD4A3;--white:#FFFFFF}
*{box-sizing:border-box;margin:0;padding:0}
html,body{margin:0;background:#fff}
.root{position:relative;overflow:hidden;width:1640px;height:624px;background:var(--ink);color:var(--white);font-family:Figtree,system-ui,sans-serif}
.abs{position:absolute}
.wrap{display:flex;align-items:center;gap:20px}
.display{font-family:"Bricolage Grotesque",Figtree,sans-serif;font-weight:800;letter-spacing:-.03em;line-height:.92}
.wm{font-family:"Bricolage Grotesque",Figtree,sans-serif;font-weight:800;letter-spacing:-.03em;line-height:1}
.tag{display:inline-block;background:var(--pink);color:var(--ink);border:6px solid var(--white);border-radius:28px;padding:4px 26px 0;line-height:1.02;transform:rotate(-3deg)}
.mock{position:absolute;display:flex;flex-direction:column;background:var(--white);border:6px solid var(--ink);border-radius:26px;overflow:hidden;--accent:var(--pink)}
.mock .nav{height:56px;flex:0 0 auto;border-bottom:6px solid var(--ink);display:flex;align-items:center;gap:12px;padding:0 22px}
.mock .dot{width:16px;height:16px;border-radius:50%;background:var(--ink)}
.mock .hero{flex:1.3;margin:22px 22px 16px;background:var(--accent);border:6px solid var(--ink);border-radius:18px}
.mock .cols{flex:1;display:flex;gap:16px;margin:0 22px 22px}
.mock .cols span{flex:1;border:6px solid var(--ink);border-radius:16px;background:var(--white)}
</style>
</head>
<body>
<div class="root">
  <div class="abs wrap" style="left:72px;top:60px">
    <svg width="78" height="78" viewBox="1 4 56 56" role="img" aria-label="Marca clavonia">
      <rect x="6" y="6" width="46" height="13" rx="5" fill="#FFFFFF"/>
      <rect x="6" y="6" width="13" height="52" rx="5" fill="#FFFFFF"/>
      <rect x="6" y="45" width="46" height="13" rx="5" fill="#FFFFFF"/>
      <rect x="42" y="23" width="9" height="18" rx="3" fill="#FF5C8A"/>
    </svg>
    <span class="wm" style="font-size:62px">clavonia</span>
  </div>

  <div class="abs" style="left:400px;top:128px;width:840px;text-align:center">
    <h1 class="display" style="font-size:96px">Tu página,<br>lista en<br><span class="tag" style="font-size:96px">minutos.</span></h1>
    <p style="margin-top:30px;font-size:30px;font-weight:600;line-height:1.35">Elige una plantilla, edita por bloques<br>y publica cuando quieras.</p>
  </div>

  <div class="mock" style="left:1218px;top:112px;width:336px;height:250px;transform:rotate(5deg);box-shadow:12px 12px 0 var(--pink)">
    <div class="nav"><i class="dot"></i><i class="dot"></i><i class="dot"></i></div>
    <div class="hero"></div>
    <div class="cols"><span></span><span></span></div>
  </div>
</div>
</body>
</html>
