<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>clavonia historia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700..800&family=Figtree:wght@500..800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1B1464;--pink:#FF5C8A;--butter:#FFE66D;--mint:#2BD4A3;--white:#FFFFFF}
*{box-sizing:border-box;margin:0;padding:0}
html,body{margin:0;background:#fff}
/* Zona segura: el texto clave queda entre 250 px y 1670 px. */
.root{position:relative;overflow:hidden;width:1080px;height:1920px;background:var(--ink);color:var(--white);font-family:Figtree,system-ui,sans-serif}
.abs{position:absolute}
.wrap{display:flex;align-items:center;gap:22px}
.display{font-family:"Bricolage Grotesque",Figtree,sans-serif;font-weight:800;letter-spacing:-.03em;line-height:.92}
.wm{font-family:"Bricolage Grotesque",Figtree,sans-serif;font-weight:800;letter-spacing:-.03em;line-height:1}
.tag{display:inline-block;background:var(--pink);color:var(--ink);border:6px solid var(--white);border-radius:32px;padding:4px 30px 0;line-height:1.02;transform:rotate(-3deg)}
.mock{position:absolute;display:flex;flex-direction:column;background:var(--white);border:6px solid var(--ink);border-radius:30px;overflow:hidden;--accent:var(--pink)}
.mock .nav{height:64px;flex:0 0 auto;border-bottom:6px solid var(--ink);display:flex;align-items:center;gap:14px;padding:0 26px}
.mock .dot{width:18px;height:18px;border-radius:50%;background:var(--ink)}
.mock .hero{flex:1.3;margin:28px 28px 22px;background:var(--accent);border:6px solid var(--ink);border-radius:22px}
.mock .cols{flex:1;display:flex;gap:20px;margin:0 28px 28px}
.mock .cols span{flex:1;border:6px solid var(--ink);border-radius:18px;background:var(--white)}
.sub{font-size:50px;font-weight:600;line-height:1.3}
.sub b{color:var(--pink);font-weight:800}
</style>
</head>
<body>
<div class="root">
  <div class="abs wrap" style="left:80px;top:270px">
    <svg width="96" height="96" viewBox="1 4 56 56" role="img" aria-label="Marca clavonia">
      <rect x="6" y="6" width="46" height="13" rx="5" fill="#FFFFFF"/>
      <rect x="6" y="6" width="13" height="52" rx="5" fill="#FFFFFF"/>
      <rect x="6" y="45" width="46" height="13" rx="5" fill="#FFFFFF"/>
      <rect x="42" y="23" width="9" height="18" rx="3" fill="#FF5C8A"/>
    </svg>
    <span class="wm" style="font-size:74px">clavonia</span>
  </div>

  <h1 class="abs display" style="left:80px;top:420px;font-size:160px">Tu página,<br>lista en<br><span class="tag" style="font-size:160px">minutos.</span></h1>

  <div class="mock" style="left:80px;top:930px;width:920px;height:380px;transform:rotate(-3deg);box-shadow:16px 16px 0 var(--pink)">
    <div class="nav"><i class="dot"></i><i class="dot"></i><i class="dot"></i></div>
    <div class="hero"></div>
    <div class="cols"><span></span><span></span></div>
  </div>

  <p class="abs sub" style="left:80px;top:1360px;width:920px"><b>Elige una plantilla,</b> edita por bloques y <b>publica cuando quieras.</b></p>
</div>
</body>
</html>
