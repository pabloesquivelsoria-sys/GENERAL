<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>clavonia avatar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700..800&family=Figtree:wght@500..800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1B1464;--pink:#FF5C8A;--butter:#FFE66D;--mint:#2BD4A3;--white:#FFFFFF}
*{box-sizing:border-box;margin:0;padding:0}
html,body{margin:0;background:#fff}
.root{position:relative;overflow:hidden;width:1080px;height:1080px;background:var(--butter);color:var(--ink);font-family:Figtree,system-ui,sans-serif}
.mark{position:absolute;left:300px;top:200px}
.word{position:absolute;left:0;right:0;top:696px;text-align:center;font-family:"Bricolage Grotesque",Figtree,sans-serif;font-weight:800;font-size:128px;letter-spacing:-.03em;line-height:1}
</style>
</head>
<body>
<div class="root">
  <svg class="mark" width="480" height="480" viewBox="1 4 56 56" role="img" aria-label="Marca clavonia">
    <rect x="6" y="6" width="46" height="13" rx="5" fill="#1B1464"/>
    <rect x="6" y="6" width="13" height="52" rx="5" fill="#1B1464"/>
    <rect x="6" y="45" width="46" height="13" rx="5" fill="#1B1464"/>
    <rect x="42" y="23" width="9" height="18" rx="3" fill="#FF5C8A"/>
  </svg>
  <div class="word">clavonia</div>
</div>
</body>
</html>
