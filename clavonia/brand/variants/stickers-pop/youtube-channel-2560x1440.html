<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portada de YouTube</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700..800&family=Figtree:wght@500..800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{margin:0;background:#fff}
.root{position:relative;overflow:hidden;width:2560px;height:1440px;background:#1B1464;color:#FFE66D;font-family:Figtree,system-ui,sans-serif}
.abs{position:absolute}
.bri{font-family:"Bricolage Grotesque",Figtree,sans-serif;font-weight:800;letter-spacing:-.03em;line-height:.92}
.wm{font-family:"Bricolage Grotesque",Figtree,sans-serif;font-weight:800;letter-spacing:-.03em;line-height:1}
.logo{display:flex;align-items:center}
.logo svg{display:block;flex:0 0 auto}
.tag{display:inline-block;border-radius:.28em;padding:.04em .25em 0;line-height:1.02;transform:rotate(-3deg)}
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;font-weight:800;white-space:nowrap;line-height:1}
.sub{font-weight:600;line-height:1.35;text-wrap:balance}

</style>
</head>
<body>
<div class="root">
<div class="abs" style="left:120px;top:150px;width:380px;height:210px;background:#FF5C8A;border:12px solid #FFE66D;border-radius:60px;transform:rotate(-8deg)"></div><div class="abs" style="left:2190px;top:110px;width:280px;height:280px;border-radius:50%;background:#FFE66D;border:12px solid #FF5C8A"></div><div class="abs" style="left:2130px;top:1060px;width:340px;height:200px;background:#FFE66D;border:12px solid #FF5C8A;border-radius:56px;transform:rotate(7deg)"></div><div class="abs" style="left:130px;top:1080px;display:flex;gap:26px"><span style="width:200px;height:90px;border:10px solid #FFE66D;border-radius:26px;background:#FFE66D"></span><span style="width:320px;height:90px;border:10px solid #FFE66D;border-radius:26px;background:#1B1464"></span><span style="width:240px;height:90px;border:10px solid #FFE66D;border-radius:26px;background:#FF5C8A"></span></div><div class="abs" style="left:980px;top:120px;width:90px;height:90px;border-radius:50%;background:#FF5C8A"></div><div class="abs" style="left:1500px;top:1180px;width:70px;height:70px;border-radius:50%;background:#FFE66D"></div><div class="abs logo" style="left:580px;top:546px;gap:18px;"><svg width="80" height="80" viewBox="1 4 56 56" role="img" aria-label="Marca clavonia"><rect x="6" y="6" width="46" height="13" rx="5" fill="#FFE66D"/><rect x="6" y="6" width="13" height="52" rx="5" fill="#FFE66D"/><rect x="6" y="45" width="46" height="13" rx="5" fill="#FFE66D"/><rect x="42" y="23" width="9" height="18" rx="3" fill="#FF5C8A"/></svg><span class="wm" style="font-size:66px;color:#FFE66D">clavonia</span></div><h1 class="abs bri" style="left:580px;top:662px;font-size:116px">Tu página, lista<br>en <span class="tag" style="background:#FF5C8A;color:#1B1464;border:8px solid #FFE66D">minutos.</span></h1><div class="abs" style="left:1570px;top:570px;width:430px;height:320px;transform:rotate(5deg);background:#FFE66D;border:6px solid #1B1464;border-radius:27px;box-shadow:13px 13px 0 #FF5C8A;overflow:hidden;display:flex;flex-direction:column"><div style="height:59px;flex:0 0 auto;border-bottom:6px solid #1B1464;display:flex;align-items:center;gap:13px;padding:0 23px"><i style="width:17px;height:17px;border-radius:50%;background:#1B1464"></i><i style="width:17px;height:17px;border-radius:50%;background:#1B1464"></i><i style="width:17px;height:17px;border-radius:50%;background:#1B1464"></i></div><div style="flex:1.3;margin:23px 23px 17px;background:#FF5C8A;border:6px solid #1B1464;border-radius:19px"></div><div style="flex:1;display:flex;gap:17px;margin:0 23px 23px"><span style="flex:1;border:6px solid #1B1464;border-radius:17px;background:#FFE66D"></span><span style="flex:1;border:6px solid #1B1464;border-radius:17px;background:#FFE66D"></span></div></div>
</div>
</body>
</html>
