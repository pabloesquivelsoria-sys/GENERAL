<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>clavonia cuadrado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700..800&family=Figtree:wght@500..800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1B1464;--pink:#FF5C8A;--butter:#FFE66D;--mint:#2BD4A3;--white:#FFFFFF}
*{box-sizing:border-box;margin:0;padding:0}
html,body{margin:0;background:#fff}
.root{position:relative;overflow:hidden;width:1080px;height:1080px;background:var(--pink);color:var(--ink);font-family:Figtree,system-ui,sans-serif}
.abs{position:absolute}
.wrap{display:flex;align-items:center;gap:22px}
.display{font-family:"Bricolage Grotesque",Figtree,sans-serif;font-weight:800;letter-spacing:-.03em;line-height:.92}
.wm{font-family:"Bricolage Grotesque",Figtree,sans-serif;font-weight:800;letter-spacing:-.03em;line-height:1}
.tag{display:inline-block;background:var(--white);color:var(--ink);border:6px solid var(--ink);border-radius:30px;padding:4px 28px 0;line-height:1.02;transform:rotate(-3deg)}
.stk{position:absolute;background:var(--white);border:6px solid var(--ink);border-radius:32px;box-shadow:10px 10px 0 var(--ink);padding:40px 48px}
.block{position:absolute;top:960px;height:80px;background:var(--white);border:6px solid var(--ink);border-radius:20px}
</style>
</head>
<body>
<div class="root">
  <div class="abs wrap" style="left:80px;top:80px">
    <svg width="84" height="84" viewBox="1 4 56 56" role="img" aria-label="Marca clavonia">
      <rect x="6" y="6" width="46" height="13" rx="5" fill="#1B1464"/>
      <rect x="6" y="6" width="13" height="52" rx="5" fill="#1B1464"/>
      <rect x="6" y="45" width="46" height="13" rx="5" fill="#1B1464"/>
      <rect x="42" y="23" width="9" height="18" rx="3" fill="#FFFFFF"/>
    </svg>
    <span class="wm" style="font-size:62px">clavonia</span>
  </div>

  <h1 class="abs display" style="left:80px;top:220px;font-size:132px">Tu página,<br>lista en<br><span class="tag" style="font-size:132px">minutos.</span></h1>

  <div class="stk" style="left:80px;top:640px;width:920px;transform:rotate(-2deg);font-size:42px;font-weight:700;line-height:1.3">Elige una plantilla, edita por bloques y publica cuando quieras.</div>

  <div class="block" style="left:80px;width:220px;background:var(--ink)"></div>
  <div class="block" style="left:324px;width:360px"></div>
  <div class="block" style="left:708px;width:292px"></div>
</div>
</body>
</html>
