<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anuncio 320x100</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700..800&family=Figtree:wght@500..800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{margin:0;background:#fff}
.root{position:relative;overflow:hidden;width:320px;height:100px;background:#1B1464;color:#FFFFFF;font-family:Figtree,system-ui,sans-serif}
.abs{position:absolute}
.bri{font-family:"Bricolage Grotesque",Figtree,sans-serif;font-weight:800;letter-spacing:-.03em;line-height:.92}
.wm{font-family:"Bricolage Grotesque",Figtree,sans-serif;font-weight:800;letter-spacing:-.03em;line-height:1}
.logo{display:flex;align-items:center}
.logo svg{display:block;flex:0 0 auto}
.tag{display:inline-block;border-radius:.28em;padding:.04em .25em 0;line-height:1.02;transform:rotate(-3deg)}
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;font-weight:800;white-space:nowrap;line-height:1}
.sub{font-weight:600;line-height:1.35;text-wrap:balance}

</style>
</head>
<body>
<div class="root">
<div class="abs logo" style="left:14px;top:14px;gap:6px;"><svg width="24" height="24" viewBox="1 4 56 56" role="img" aria-label="Marca clavonia"><rect x="6" y="6" width="46" height="13" rx="5" fill="#FFFFFF"/><rect x="6" y="6" width="13" height="52" rx="5" fill="#FFFFFF"/><rect x="6" y="45" width="46" height="13" rx="5" fill="#FFFFFF"/><rect x="42" y="23" width="9" height="18" rx="3" fill="#FFE66D"/></svg><span class="wm" style="font-size:20px;color:#FFFFFF">clavonia</span></div><h1 class="abs bri" style="left:14px;top:48px;font-size:19px;line-height:1.05">Tu página, lista<br>en minutos.</h1><span class="abs btn" style="right:12px;top:28px;height:44px;padding:0 14px;font-size:15px;background:#FFE66D;color:#1B1464;border:3px solid #FFE66D;">Empieza hoy</span>
</div>
</body>
</html>
