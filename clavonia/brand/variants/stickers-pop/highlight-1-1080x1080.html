<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>clavonia destacado planes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700..800&family=Figtree:wght@500..800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1B1464;--pink:#FF5C8A;--butter:#FFE66D;--mint:#2BD4A3;--white:#FFFFFF}
*{box-sizing:border-box;margin:0;padding:0}
html,body{margin:0;background:#fff}
.root{position:relative;overflow:hidden;width:1080px;height:1080px;background:var(--ink);color:var(--ink);font-family:Figtree,system-ui,sans-serif}
.abs{position:absolute}
.sticker{position:absolute;display:flex;align-items:center;justify-content:center;background:var(--pink);border:10px solid var(--white);border-radius:72px;box-shadow:14px 14px 0 var(--white);font-family:"Bricolage Grotesque",Figtree,sans-serif;font-weight:800;font-size:200px;letter-spacing:-.03em;line-height:1}
.tier{position:absolute;height:60px;background:var(--pink);border:6px solid var(--white);border-radius:30px}
</style>
</head>
<body>
<div class="root">
  <div class="sticker" style="left:130px;top:320px;width:820px;height:290px;transform:rotate(-6deg)">Planes</div>

  <div class="tier" style="left:410px;top:700px;width:260px"></div>
  <div class="tier" style="left:350px;top:780px;width:380px"></div>
  <div class="tier" style="left:290px;top:860px;width:500px"></div>
</div>
</body>
</html>
