<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portada de empresa en LinkedIn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700..800&family=Figtree:wght@500..800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{margin:0;background:#fff}
.root{position:relative;overflow:hidden;width:1128px;height:191px;background:#1B1464;color:#FFFFFF;font-family:Figtree,system-ui,sans-serif}
.abs{position:absolute}
.bri{font-family:"Bricolage Grotesque",Figtree,sans-serif;font-weight:800;letter-spacing:-.03em;line-height:.92}
.wm{font-family:"Bricolage Grotesque",Figtree,sans-serif;font-weight:800;letter-spacing:-.03em;line-height:1}
.logo{display:flex;align-items:center}
.logo svg{display:block;flex:0 0 auto}
.tag{display:inline-block;border-radius:.28em;padding:.04em .25em 0;line-height:1.02;transform:rotate(-3deg)}
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;font-weight:800;white-space:nowrap;line-height:1}
.sub{font-weight:600;line-height:1.35;text-wrap:balance}

</style>
</head>
<body>
<div class="root">
<div class="abs" style="left:200px;top:0;height:191px;display:flex;align-items:center;gap:36px"><div class="logo" style="gap:12px"><svg width="56" height="56" viewBox="1 4 56 56" role="img" aria-label="Marca clavonia"><rect x="6" y="6" width="46" height="13" rx="5" fill="#FFFFFF"/><rect x="6" y="6" width="13" height="52" rx="5" fill="#FFFFFF"/><rect x="6" y="45" width="46" height="13" rx="5" fill="#FFFFFF"/><rect x="42" y="23" width="9" height="18" rx="3" fill="#FF5C8A"/></svg><span class="wm" style="font-size:46px">clavonia</span></div><span style="width:3px;height:64px;background:#FFFFFF;border-radius:2px"></span><h1 class="bri" style="font-size:42px;line-height:1">Tu página, lista en <span class="tag" style="background:#FF5C8A;color:#1B1464;border:4px solid #FFFFFF">minutos.</span></h1></div>
</div>
</body>
</html>
