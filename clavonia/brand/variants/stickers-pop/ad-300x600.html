<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anuncio 300x600</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700..800&family=Figtree:wght@500..800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{margin:0;background:#fff}
.root{position:relative;overflow:hidden;width:300px;height:600px;background:#FF5C8A;color:#1B1464;font-family:Figtree,system-ui,sans-serif}
.abs{position:absolute}
.bri{font-family:"Bricolage Grotesque",Figtree,sans-serif;font-weight:800;letter-spacing:-.03em;line-height:.92}
.wm{font-family:"Bricolage Grotesque",Figtree,sans-serif;font-weight:800;letter-spacing:-.03em;line-height:1}
.logo{display:flex;align-items:center}
.logo svg{display:block;flex:0 0 auto}
.tag{display:inline-block;border-radius:.28em;padding:.04em .25em 0;line-height:1.02;transform:rotate(-3deg)}
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;font-weight:800;white-space:nowrap;line-height:1}
.sub{font-weight:600;line-height:1.35;text-wrap:balance}

</style>
</head>
<body>
<div class="root">
<div class="abs logo" style="left:24px;top:28px;gap:9px;"><svg width="40" height="40" viewBox="1 4 56 56" role="img" aria-label="Marca clavonia"><rect x="6" y="6" width="46" height="13" rx="5" fill="#1B1464"/><rect x="6" y="6" width="13" height="52" rx="5" fill="#1B1464"/><rect x="6" y="45" width="46" height="13" rx="5" fill="#1B1464"/><rect x="42" y="23" width="9" height="18" rx="3" fill="#FFFFFF"/></svg><span class="wm" style="font-size:34px;color:#1B1464">clavonia</span></div><h1 class="abs bri" style="left:24px;top:104px;font-size:46px">Tu página,<br>lista en<br><span class="tag" style="background:#FFFFFF;color:#1B1464;border:3px solid #1B1464">minutos.</span></h1><div class="abs" style="left:32px;top:292px;width:236px;height:190px;transform:rotate(-4deg);background:#FFFFFF;border:3px solid #1B1464;border-radius:14px;box-shadow:7px 7px 0 #1B1464;overflow:hidden;display:flex;flex-direction:column"><div style="height:31px;flex:0 0 auto;border-bottom:3px solid #1B1464;display:flex;align-items:center;gap:7px;padding:0 12px"><i style="width:9px;height:9px;border-radius:50%;background:#1B1464"></i><i style="width:9px;height:9px;border-radius:50%;background:#1B1464"></i><i style="width:9px;height:9px;border-radius:50%;background:#1B1464"></i></div><div style="flex:1.3;margin:12px 12px 9px;background:#FF5C8A;border:3px solid #1B1464;border-radius:10px"></div><div style="flex:1;display:flex;gap:9px;margin:0 12px 12px"><span style="flex:1;border:3px solid #1B1464;border-radius:9px;background:#FFFFFF"></span><span style="flex:1;border:3px solid #1B1464;border-radius:9px;background:#FFFFFF"></span></div></div><span class="abs btn" style="left:0;right:0;margin:0 auto;width:max-content;top:520px;height:52px;padding:0 24px;font-size:18px;background:#1B1464;color:#FFFFFF;border:3px solid #1B1464;box-shadow:4px 4px 0 #FFFFFF;">Crear mi página</span>
</div>
</body>
</html>
