<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<title>Banners para redes y anuncios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{margin:0;background:#fff}
.root{position:relative;overflow:hidden;width:1600px;height:1200px;background:#FFE66D;color:#1B1464;font-family:Figtree,system-ui,sans-serif}
.abs{position:absolute}
.bri{font-family:"Bricolage Grotesque",Figtree,sans-serif;font-weight:800;letter-spacing:-.03em;line-height:.92}
.wm{font-family:"Bricolage Grotesque",Figtree,sans-serif;font-weight:800;letter-spacing:-.03em;line-height:1}
.logo{display:flex;align-items:center}
.logo svg{display:block;flex:0 0 auto}
.tag{display:inline-block;border-radius:.28em;padding:.04em .25em 0;line-height:1.02;transform:rotate(-3deg)}
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;font-weight:800;white-space:nowrap;line-height:1}
.sub{font-weight:600;line-height:1.35;text-wrap:balance}
.cell{background:#FFFFFF;border:3px solid #1B1464;border-radius:18px;box-shadow:6px 6px 0 #1B1464;padding:12px 12px 0;display:flex;flex-direction:column}.box{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}.box img{max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain;display:block}figcaption{flex:0 0 44px;display:block;padding-top:8px;font-size:14px;font-weight:600;line-height:1.3}figcaption b{font-weight:800;margin-right:4px}
</style>
</head>
<body>
<div class="root">

><div class="box"><img src="youtube-thumbnail-1280x720.png" alt="YouTube Miniatura 1280 × 720"></div><figcaption><b>YouTube</b> · Miniatura · 1280 × 720</figcaption></figure><figure class="abs cell" style="left:40px;top:628px;width:260px;height:530px"><div class="box"><img src="pinterest-pin-1000x1500.png" alt="Pinterest Pin 1000 × 1500"></div><figcaption><b>Pinterest</b> · Pin · 1000 × 1500</figcaption></figure><figure class="abs cell" style="left:324px;top:628px;width:230px;height:530px"><div class="box"><img src="tiktok-cover-1080x1920.png" alt="TikTok Portada 1080 × 1920"></div><figcaption><b>TikTok</b> · Portada · 1080 × 1920</figcaption></figure><figure class="abs cell" style="left:578px;top:628px;width:200px;height:530px"><div class="box"><img src="ad-300x600.png" alt="Google Ads Media página 300 × 600"></div><figcaption><b>Google Ads</b> · Media página · 300 × 600</figcaption></figure><figure class="abs cell" style="left:802px;top:628px;width:367px;height:253px"><div class="box"><img src="ad-300x250.png" alt="Google Ads Rectángulo 300 × 250"></div><figcaption><b>Google Ads</b> · Rectángulo · 300 × 250</figcaption></figure><figure class="abs cell" style="left:1193px;top:628px;width:367px;height:253px"><div class="box"><img src="ad-336x280.png" alt="Google Ads Rectángulo grande 336 × 280"></div><figcaption><b>Google Ads</b> · Rectángulo grande · 336 × 280</figcaption></figure><figure class="abs cell" style="left:802px;top:905px;width:367px;height:253px"><div class="box"><img src="ad-728x90.png" alt="Google Ads Leaderboard 728 × 90"></div><figcaption><b>Google Ads</b> · Leaderboard · 728 × 90</figcaption></figure><figure class="abs cell" style="left:1193px;top:905px;width:367px;height:253px"><div class="box"><img src="ad-320x100.png" alt="Google Ads Banner móvil grande 320 × 100"></div><figcaption><b>Google Ads</b> · Banner móvil grande · 320 × 100</figcaption></figure>
