<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anuncio 336x280</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700..800&family=Figtree:wght@500..800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{margin:0;background:#fff}
.root{position:relative;overflow:hidden;width:336px;height:280px;background:#FFE66D;color:#1B1464;font-family:Figtree,system-ui,sans-serif}
.abs{position:absolute}
.bri{font-family:"Bricolage Grotesque",Figtree,sans-serif;font-weight:800;letter-spacing:-.03em;line-height:.92}
.wm{font-family:"Bricolage Grotesque",Figtree,sans-serif;font-weight:800;letter-spacing:-.03em;line-height:1}
.logo{display:flex;align-items:center}
.logo svg{display:block;flex:0 0 auto}
.tag{display:inline-block;border-radius:.28em;padding:.04em .25em 0;line-height:1.02;transform:rotate(-3deg)}
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;font-weight:800;white-space:nowrap;line-height:1}
.sub{font-weight:600;line-height:1.35;text-wrap:balance}

</style>
</head>
<body>
<div class="root">
<div class="abs logo" style="left:22px;top:20px;gap:7px;"><svg width="32" height="32" viewBox="1 4 56 56" role="img" aria-label="Marca clavonia"><rect x="6" y="6" width="46" height="13" rx="5" fill="#1B1464"/><rect x="6" y="6" width="13" height="52" rx="5" fill="#1B1464"/><rect x="6" y="45" width="46" height="13" rx="5" fill="#1B1464"/><rect x="42" y="23" width="9" height="18" rx="3" fill="#FF5C8A"/></svg><span class="wm" style="font-size:27px;color:#1B1464">clavonia</span></div><h1 class="abs bri" style="left:22px;top:74px;font-size:34px;line-height:1">Tu página, lista<br>en minutos.</h1><span class="abs btn" style="left:22px;top:206px;height:50px;padding:0 22px;font-size:18px;background:#FF5C8A;color:#1B1464;border:3px solid #1B1464;box-shadow:4px 4px 0 #1B1464;">Empieza hoy</span><div class="abs" style="left:214px;top:132px;width:98px;height:110px;transform:rotate(6deg);background:#FFE66D;border:3px solid #1B1464;border-radius:8px;box-shadow:3px 3px 0 #1B1464;overflow:hidden;display:flex;flex-direction:column"><div style="height:15px;flex:0 0 auto;border-bottom:3px solid #1B1464;display:flex;align-items:center;gap:4px;padding:0 6px"><i style="width:5px;height:5px;border-radius:50%;background:#1B1464"></i><i style="width:5px;height:5px;border-radius:50%;background:#1B1464"></i><i style="width:5px;height:5px;border-radius:50%;background:#1B1464"></i></div><div style="flex:1.3;margin:6px 6px 5px;background:#FF5C8A;border:3px solid #1B1464;border-radius:5px"></div><div style="flex:1;display:flex;gap:5px;margin:0 6px 6px"><span style="flex:1;border:3px solid #1B1464;border-radius:5px;background:#FFE66D"></span><span style="flex:1;border:3px solid #1B1464;border-radius:5px;background:#FFE66D"></span></div></div>
</div>
</body>
</html>
