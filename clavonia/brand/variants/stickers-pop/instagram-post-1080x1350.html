<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>clavonia post</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700..800&family=Figtree:wght@500..800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1B1464;--pink:#FF5C8A;--butter:#FFE66D;--mint:#2BD4A3;--white:#FFFFFF}
*{box-sizing:border-box;margin:0;padding:0}
html,body{margin:0;background:#fff}
.root{position:relative;overflow:hidden;width:1080px;height:1350px;background:var(--butter);color:var(--ink);font-family:Figtree,system-ui,sans-serif}
.abs{position:absolute}
.wrap{display:flex;align-items:center;gap:22px}
.display{font-family:"Bricolage Grotesque",Figtree,sans-serif;font-weight:800;letter-spacing:-.03em;line-height:.92}
.wm{font-family:"Bricolage Grotesque",Figtree,sans-serif;font-weight:800;letter-spacing:-.03em;line-height:1}
.stk{position:absolute;border:6px solid var(--ink);border-radius:36px;box-shadow:10px 10px 0 var(--ink);background:var(--pink)}
.row{display:flex;align-items:center;gap:28px;padding:0 44px}
.num{font-size:112px;width:96px;text-align:center;flex:0 0 auto}
.step{font-size:46px;font-weight:800;letter-spacing:-.01em;line-height:1.1}
</style>
</head>
<body>
<div class="root">
  <div class="abs wrap" style="left:80px;top:70px">
    <svg width="84" height="84" viewBox="1 4 56 56" role="img" aria-label="Marca clavonia">
      <rect x="6" y="6" width="46" height="13" rx="5" fill="#1B1464"/>
      <rect x="6" y="6" width="13" height="52" rx="5" fill="#1B1464"/>
      <rect x="6" y="45" width="46" height="13" rx="5" fill="#1B1464"/>
      <rect x="42" y="23" width="9" height="18" rx="3" fill="#FF5C8A"/>
    </svg>
    <span class="wm" style="font-size:62px">clavonia</span>
  </div>

  <h1 class="abs display" style="left:80px;top:196px;font-size:150px">Tu página,<br>lista en<br>minutos.</h1>

  <p class="abs" style="left:80px;top:650px;width:860px;font-size:42px;font-weight:600;line-height:1.3">Elige una plantilla, edita por bloques y publica cuando quieras.</p>

  <div class="stk row" style="left:80px;top:860px;width:920px;height:124px;transform:rotate(-1.5deg)">
    <span class="display num">1</span><span class="step">Elige una plantilla</span>
  </div>
  <div class="stk row" style="left:80px;top:1006px;width:920px;height:124px;transform:rotate(1deg)">
    <span class="display num">2</span><span class="step">Edita por bloques</span>
  </div>
  <div class="stk row" style="left:80px;top:1152px;width:920px;height:124px;transform:rotate(-1deg)">
    <span class="display num">3</span><span class="step">Publica cuando quieras</span>
  </div>
</div>
</body>
</html>
