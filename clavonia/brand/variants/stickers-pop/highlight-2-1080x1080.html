<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>clavonia destacado como funciona</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700..800&family=Figtree:wght@500..800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1B1464;--pink:#FF5C8A;--butter:#FFE66D;--mint:#2BD4A3;--white:#FFFFFF}
*{box-sizing:border-box;margin:0;padding:0}
html,body{margin:0;background:#fff}
.root{position:relative;overflow:hidden;width:1080px;height:1080px;background:var(--butter);color:var(--ink);font-family:Figtree,system-ui,sans-serif}
.abs{position:absolute}
.display{font-family:"Bricolage Grotesque",Figtree,sans-serif;font-weight:800;letter-spacing:-.03em;line-height:.92}
.dot{position:absolute;top:490px;width:220px;height:220px;border-radius:50%;background:var(--white);border:8px solid var(--ink);box-shadow:12px 12px 0 var(--ink);display:flex;align-items:center;justify-content:center;font-family:"Bricolage Grotesque",Figtree,sans-serif;font-weight:800;font-size:150px;line-height:1}
.label{position:absolute;top:742px;width:260px;text-align:center;font-family:"Bricolage Grotesque",Figtree,sans-serif;font-weight:800;font-size:52px;letter-spacing:-.02em;line-height:1}
</style>
</head>
<body>
<div class="root">
  <h1 class="abs display" style="left:0;right:0;top:225px;text-align:center;font-size:124px">Cómo<br>funciona</h1>

  <div class="dot" style="left:190px;top:535px">1</div>
  <div class="dot" style="left:430px;top:535px">2</div>
  <div class="dot" style="left:670px;top:535px">3</div>

  <div class="label" style="left:170px;top:787px">Elige</div>
  <div class="label" style="left:410px;top:787px">Edita</div>
  <div class="label" style="left:650px;top:787px">Publica</div>
</div>
</body>
</html>
