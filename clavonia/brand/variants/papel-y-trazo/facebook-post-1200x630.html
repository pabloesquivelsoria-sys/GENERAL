<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Clavonia imagen para enlace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#F7F7F2;width:1200px;height:630px;overflow:hidden}
.root{position:relative;width:1200px;height:630px;overflow:hidden;background:#F7F7F2;color:#1D2B24;font-family:'DM Sans',sans-serif}
.a{position:absolute}
.grain{position:absolute;left:0;top:0;width:1200px;height:630px;opacity:.09;mix-blend-mode:multiply;pointer-events:none;z-index:60}
.hand{font-family:'Caveat',cursive;font-weight:700;color:#2E4A3E}
.u{position:relative;display:inline-block;white-space:nowrap}
.ul{position:absolute;left:-1%;width:102%;height:auto;bottom:-.16em;overflow:visible}
.lock{display:flex;align-items:center;gap:.2em;font-weight:700;letter-spacing:-.02em;line-height:1}
.mk{display:block}
h1{font-weight:800;letter-spacing:-.035em;line-height:1.02;white-space:nowrap}
.note{position:absolute;background:#A7C4B5;color:#1D2B24;box-shadow:8px 9px 0 rgba(29,43,36,.14);display:flex;align-items:center;gap:18px;padding:24px 26px;font-size:30px;font-weight:700;line-height:1.2;width:340px}
.note::before{content:"";position:absolute;left:50%;top:-15px;width:118px;height:32px;margin-left:-59px;background:#E8B04B;transform:rotate(-3deg)}
.note.deep{background:#2E4A3E;color:#F7F7F2}
.note .n{font-family:'Caveat',cursive;font-weight:700;font-size:80px;line-height:1;flex:none}
</style>
</head>
<body>
<div class="root">
  <div class="a lock" style="left:80px;top:70px;font-size:50px">
    <svg class="mk" width="62" height="62" viewBox="0 0 120 120" aria-hidden="true"><path d="M94 36C84 20 62 12 44 18C24 25 16 46 18 66C20 88 40 104 66 100C80 98 90 92 98 82" fill="none" stroke="#1D2B24" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M84 50V72" stroke="#E8B04B" stroke-width="10" stroke-linecap="round"/></svg>
    <span>clavonia</span>
  </div>

  <h1 class="a" style="left:80px;top:160px;font-size:76px">Tu página,<br>lista <span class="hand u" style="font-size:1.2em;letter-spacing:0">en minutos.<svg class="ul" viewBox="0 0 400 24" preserveAspectRatio="none" aria-hidden="true"><path d="M6 15C90 6 170 22 260 11S360 17 394 8" fill="none" stroke="#2E4A3E" stroke-width="6" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg></span></h1>

  <p class="a" style="left:80px;top:392px;width:600px;font-size:26px;line-height:1.4">Elige una plantilla, edita por bloques y publica cuando quieras.</p>

  <div class="note" style="left:770px;top:84px;transform:rotate(-3deg)"><span class="n">1</span><span>Elige una plantilla</span></div>
  <div class="note" style="left:806px;top:252px;transform:rotate(2deg)"><span class="n">2</span><span>Edita por bloques</span></div>
  <div class="note deep" style="left:772px;top:420px;transform:rotate(-2deg)"><span class="n">3</span><span>Publica cuando quieras</span></div>

  <svg class="grain" aria-hidden="true"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
</div>
</body>
</html>
