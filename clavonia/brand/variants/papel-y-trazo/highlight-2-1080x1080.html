<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Clavonia destacado Cómo funciona</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#2E4A3E;width:1080px;height:1080px;overflow:hidden}
.root{position:relative;width:1080px;height:1080px;overflow:hidden;background:#2E4A3E;color:#F7F7F2;font-family:'DM Sans',sans-serif}
.a{position:absolute}
.grain{position:absolute;left:0;top:0;width:1080px;height:1080px;opacity:.09;mix-blend-mode:multiply;pointer-events:none;z-index:60}
.title{left:0;right:0;top:250px;text-align:center;font-size:140px;font-weight:800;letter-spacing:-.04em;line-height:1.02}
.u{position:relative;display:inline-block}
.ul{position:absolute;left:-2%;width:104%;height:30px;bottom:-26px;overflow:visible}
.step{position:absolute;top:640px;width:150px;height:150px;border-radius:50%;background:#A7C4B5;color:#1D2B24;font-family:'Caveat',cursive;font-weight:700;font-size:112px;line-height:1;display:flex;align-items:center;justify-content:center;padding-bottom:8px}
.cap{position:absolute;top:806px;width:200px;text-align:center;font-family:'Caveat',cursive;font-weight:700;font-size:60px;line-height:1;color:#F7F7F2}
.lock{display:flex;align-items:center;justify-content:center;gap:.2em;font-weight:700;letter-spacing:-.02em;line-height:1;font-size:40px;left:0;right:0;top:920px}
</style>
</head>
<body>
<div class="root">
  <div class="a title">Cómo<br><span class="u">funciona<svg class="ul" viewBox="0 0 420 30" preserveAspectRatio="none" aria-hidden="true"><path d="M6 16C100 6 210 24 300 12S390 18 414 9" fill="none" stroke="#E8B04B" stroke-width="7" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg></span></div>

  <div class="step" style="left:214px">1</div>
  <div class="step" style="left:465px">2</div>
  <div class="step" style="left:716px">3</div>

  <svg class="a" style="left:372px;top:690px" width="84" height="50" viewBox="0 0 84 50" aria-hidden="true">
    <path d="M4 25C26 8 52 40 74 22" fill="none" stroke="#F7F7F2" stroke-width="5" stroke-linecap="round"/>
    <path d="M62 13L76 22L65 34" fill="none" stroke="#F7F7F2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <svg class="a" style="left:623px;top:690px" width="84" height="50" viewBox="0 0 84 50" aria-hidden="true">
    <path d="M4 25C26 8 52 40 74 22" fill="none" stroke="#F7F7F2" stroke-width="5" stroke-linecap="round"/>
    <path d="M62 13L76 22L65 34" fill="none" stroke="#F7F7F2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>

  <div class="cap" style="left:189px">Elige</div>
  <div class="cap" style="left:440px">Edita</div>
  <div class="cap" style="left:691px">Publica</div>

  <div class="a lock"><svg width="46" height="46" viewBox="0 0 120 120" aria-hidden="true"><path d="M94 36C84 20 62 12 44 18C24 25 16 46 18 66C20 88 40 104 66 100C80 98 90 92 98 82" fill="none" stroke="#F7F7F2" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M84 50V72" stroke="#E8B04B" stroke-width="10" stroke-linecap="round"/></svg><span>clavonia</span></div>

  <svg class="grain" aria-hidden="true"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
</div>
</body>
</html>
