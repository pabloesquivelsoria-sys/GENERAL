<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Clavonia portada Facebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#F7F7F2;width:1640px;height:624px;overflow:hidden}
.root{position:relative;width:1640px;height:624px;overflow:hidden;background:#F7F7F2;color:#1D2B24;font-family:'DM Sans',sans-serif}
.a{position:absolute}
.grain{position:absolute;left:0;top:0;width:1640px;height:624px;opacity:.09;mix-blend-mode:multiply;pointer-events:none;z-index:60}
.hand{font-family:'Caveat',cursive;font-weight:700;color:#2E4A3E}
.u{position:relative;display:inline-block;white-space:nowrap}
.ul{position:absolute;left:-1%;width:102%;height:auto;bottom:-.16em;overflow:visible}
.lock{display:flex;align-items:center;gap:.2em;font-weight:700;letter-spacing:-.02em;line-height:1}
.mk{display:block}
h1{font-weight:800;letter-spacing:-.035em;line-height:1.02;white-space:nowrap}
p{font-size:28px;line-height:1.4}
</style>
</head>
<body>
<div class="root">
  <div class="a lock" style="left:500px;top:100px;font-size:58px">
    <svg class="mk" width="70" height="70" viewBox="0 0 120 120" aria-hidden="true"><path d="M94 36C84 20 62 12 44 18C24 25 16 46 18 66C20 88 40 104 66 100C80 98 90 92 98 82" fill="none" stroke="#1D2B24" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M84 50V72" stroke="#E8B04B" stroke-width="10" stroke-linecap="round"/></svg>
    <span>clavonia</span>
  </div>

  <h1 class="a" style="left:500px;top:196px;font-size:88px">Tu página,<br>lista <span class="hand u" style="font-size:1.18em;letter-spacing:0">en minutos.<svg class="ul" viewBox="0 0 400 24" preserveAspectRatio="none" aria-hidden="true"><path d="M6 15C90 6 170 22 260 11S360 17 394 8" fill="none" stroke="#2E4A3E" stroke-width="6" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg></span></h1>

  <p class="a" style="left:500px;top:430px;width:680px">Elige una plantilla, edita por bloques y publica cuando quieras.</p>

  <svg class="a" style="left:1232px;top:86px;transform:rotate(-3deg)" width="330" height="412" viewBox="0 0 400 500" aria-hidden="true">
    <path d="M14 12C150 8 290 14 386 10C392 150 388 330 390 488C260 492 120 486 12 490C16 340 10 180 14 12Z" fill="#F7F7F2" stroke="#1D2B24" stroke-width="5" stroke-linejoin="round"/>
    <rect x="40" y="40" width="320" height="26" rx="8" fill="#A7C4B5"/>
    <rect x="40" y="90" width="320" height="130" rx="10" fill="#A7C4B5"/>
    <path d="M52 206L120 146L170 190L220 158L348 210" fill="none" stroke="#1D2B24" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="318" cy="122" r="16" fill="#E8B04B"/>
    <rect x="40" y="246" width="230" height="20" rx="10" fill="#1D2B24"/>
    <rect x="40" y="280" width="280" height="12" rx="6" fill="#2E4A3E"/>
    <rect x="40" y="304" width="200" height="12" rx="6" fill="#2E4A3E"/>
    <rect x="40" y="336" width="150" height="96" rx="12" fill="none" stroke="#1D2B24" stroke-width="5"/>
    <rect x="210" y="336" width="150" height="96" rx="12" fill="none" stroke="#1D2B24" stroke-width="5"/>
    <rect x="40" y="448" width="130" height="32" rx="16" fill="#2E4A3E"/>
    <rect x="236" y="444" width="9" height="40" rx="3" fill="#E8B04B"/>
    <rect x="150" y="0" width="100" height="26" fill="#E8B04B" transform="rotate(-3 200 13)"/>
  </svg>

  <svg class="grain" aria-hidden="true"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
</div>
</body>
</html>
