<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Clavonia banners para redes y anuncios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#F7F7F2;width:1600px;height:1200px;overflow:hidden}
.root{position:relative;width:1600px;height:1200px;overflow:hidden;background:#F7F7F2;color:#1D2B24;font-family:'DM Sans',sans-serif}
.a{position:absolute}
.grain{position:absolute;left:0;top:0;width:100%;height:100%;opacity:.09;mix-blend-mode:multiply;pointer-events:none;z-index:60}
.hand{font-family:'Caveat',cursive;font-weight:700;letter-spacing:0}
.u{position:relative;display:inline-block;white-space:nowrap}
.ul{position:absolute;left:-1%;width:102%;height:auto;bottom:-.16em;overflow:visible}
.lock{display:flex;align-items:center;gap:.2em;font-weight:700;letter-spacing:-.02em;line-height:1;white-space:nowrap}
.lock svg{display:block;flex:none}
h1{font-weight:800;letter-spacing:-.035em;line-height:1.04;white-space:nowrap}
.sub{line-height:1.4}
.note{position:absolute;background:#A7C4B5;color:#1D2B24;box-shadow:8px 9px 0 rgba(29,43,36,.14);display:flex;align-items:center;font-weight:700;line-height:1.2}
.note::before{content:"";position:absolute;left:50%;top:-14px;width:110px;height:30px;margin-left:-55px;background:#E8B04B;transform:rotate(-3deg)}
.note.sm::before{top:-8px;width:44px;height:15px;margin-left:-22px}
.note.deep{background:#2E4A3E;color:#F7F7F2}
.note .n{font-family:'Caveat',cursive;font-weight:700;line-height:1;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;border-radius:12px;font-weight:700;white-space:nowrap;box-shadow:4px 5px 0 rgba(29,43,36,.18);line-height:1.1}
.btn-d{background:#2E4A3E;color:#F7F7F2}
.btn-p{background:#F7F7F2;color:#1D2B24}
.frame{position:absolute;inset:0;border:1px solid rgba(29,43,36,.28);pointer-events:none;z-index:61}
.ttl{left:48px;top:40px;font-size:48px;font-weight:800;letter-spacing:-.035em;line-height:1}
.st{left:48px;top:100px;font-size:18px;color:#2E4A3E;font-weight:500}
.g{position:absolute;left:48px;top:150px;width:1504px;display:grid;grid-template-columns:repeat(6,1fr);gap:18px 20px;align-items:start}
.it{margin:0;display:flex;flex-direction:column;gap:7px;min-width:0}
.bx{background:#E9ECE3;border-radius:8px;padding:10px;display:flex;align-items:center;justify-content:center}
.bx img{width:100%;height:100%;object-fit:contain;display:block}
figcaption{font-size:15px;font-weight:700;color:#1D2B24;line-height:1.2}
.stk{display:flex;flex-direction:column;gap:14px;min-width:0}
</style>
</head>
<body>
<div class="root">
<div class="a ttl">Banners para redes y anuncios</div>
<div class="a st">Variante Papel y trazo · cada pieza a escala, con su plataforma y medida</div>
<div class="g">
<figure class="it" style="grid-column:span 2"><div class="bx" style="height:168px"><img src="x-header-1500x500.png" alt="X · Encabezado · 1500 × 500"></div><figcaption>X · Encabezado · 1500 × 500</figcaption></figure>
<figure class="it" style="grid-column:span 2"><div class="bx" style="height:168px"><img src="linkedin-banner-1584x396.png" alt="LinkedIn · Banner personal · 1584 × 396"></div><figcaption>LinkedIn · Banner personal · 1584 × 396</figcaption></figure>
<figure class="it" style="grid-column:span 2"><div class="bx" style="height:168px"><img src="linkedin-company-1128x191.png" alt="LinkedIn · Empresa · 1128 × 191"></div><figcaption>LinkedIn · Empresa · 1128 × 191</figcaption></figure>
<figure class="it" style="grid-column:span 1"><div class="bx" style="height:200px"><img src="x-post-1200x675.png" alt="X · Publicación · 1200 × 675"></div><figcaption>X · Publicación · 1200 × 675</figcaption></figure>
<figure class="it" style="grid-column:span 1"><div class="bx" style="height:200px"><img src="linkedin-post-1200x627.png" alt="LinkedIn · Publicación · 1200 × 627"></div><figcaption>LinkedIn · Publicación · 1200 × 627</figcaption></figure>
<figure class="it" style="grid-column:span 2"><div class="bx" style="height:200px"><img src="youtube-channel-2560x1440.png" alt="YouTube · Canal · 2560 × 1440"></div><figcaption>YouTube · Canal · 2560 × 1440</figcaption></figure>
<figure class="it" style="grid-column:span 1"><div class="bx" style="height:200px"><img src="youtube-thumbnail-1280x720.png" alt="YouTube · Miniatura · 1280 × 720"></div><figcaption>YouTube · Miniatura · 1280 × 720</figcaption></figure>
<div class="stk" style="grid-column:span 1"><figure class="it"><div class="bx" style="height:70px"><img src="ad-320x100.png" alt="Google Ads · 320 × 100"></div><figcaption>Google Ads · 320 × 100</figcaption></figure><figure class="it"><div class="bx" style="height:88px"><img src="ad-300x250.png" alt="Google Ads · 300 × 250"></div><figcaption>Google Ads · 300 × 250</figcaption></figure></div>
<figure class="it" style="grid-column:span 1"><div class="bx" style="height:486px"><img src="pinterest-pin-1000x1500.png" alt="Pinterest · Pin · 1000 × 1500"></div><figcaption>Pinterest · Pin · 1000 × 1500</figcaption></figure>
<figure class="it" style="grid-column:span 1"><div class="bx" style="height:486px"><img src="tiktok-cover-1080x1920.png" alt="TikTok · Portada · 1080 × 1920"></div><figcaption>TikTok · Portada · 1080 × 1920</figcaption></figure>
<figure class="it" style="grid-column:span 1"><div class="bx" style="height:486px"><img src="ad-300x600.png" alt="Google Ads · 300 × 600"></div><figcaption>Google Ads · 300 × 600</figcaption></figure>
<div class="stk" style="grid-column:span 1"><figure class="it"><div class="bx" style="height:330px"><img src="ad-336x280.png" alt="Google Ads · 336 × 280"></div><figcaption>Google Ads · 336 × 280</figcaption></figure><figure class="it"><div class="bx" style="height:100px"><img src="ad-728x90.png" alt="Google Ads · 728 × 90"></div><figcaption>Google Ads · 728 × 90</figcaption></figure></div>
</div>
<svg class="grain" aria-hidden="true"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>

</div>
</body>
</html>
