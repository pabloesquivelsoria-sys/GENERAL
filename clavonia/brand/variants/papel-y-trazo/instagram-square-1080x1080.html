<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Clavonia cuadrado Instagram</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#A7C4B5;width:1080px;height:1080px;overflow:hidden}
.root{position:relative;width:1080px;height:1080px;overflow:hidden;background:#A7C4B5;color:#1D2B24;font-family:'DM Sans',sans-serif}
.a{position:absolute}
.grain{position:absolute;left:0;top:0;width:1080px;height:1080px;opacity:.09;mix-blend-mode:multiply;pointer-events:none;z-index:60}
.hand{font-family:'Caveat',cursive;font-weight:700;color:#1D2B24}
.ring{position:relative;display:inline-block;white-space:nowrap;padding:0 .14em}
.ringsvg{position:absolute;left:-2%;top:-6%;width:104%;height:116%;overflow:visible}
.lock{display:flex;align-items:center;gap:.2em;font-weight:700;letter-spacing:-.02em;line-height:1}
.mk{display:block}
h1{font-weight:800;letter-spacing:-.04em;line-height:1;white-space:nowrap}
.pill{position:absolute;left:80px;top:920px;background:#2E4A3E;color:#F7F7F2;border-radius:60px;padding:22px 44px;font-size:34px;font-weight:700;letter-spacing:-.01em;line-height:1.2;white-space:nowrap}
.dot{position:absolute;width:20px;height:20px;border-radius:50%;background:#E8B04B}
</style>
</head>
<body>
<div class="root">
  <div class="a lock" style="left:80px;top:80px;font-size:52px">
    <svg class="mk" width="64" height="64" viewBox="0 0 120 120" aria-hidden="true"><path d="M94 36C84 20 62 12 44 18C24 25 16 46 18 66C20 88 40 104 66 100C80 98 90 92 98 82" fill="none" stroke="#1D2B24" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M84 50V72" stroke="#E8B04B" stroke-width="10" stroke-linecap="round"/></svg>
    <span>clavonia</span>
  </div>

  <div class="dot" style="left:938px;top:94px"></div>
  <div class="dot" style="left:978px;top:140px;width:12px;height:12px"></div>
  <div class="dot" style="left:912px;top:150px;width:10px;height:10px"></div>

  <h1 class="a" style="left:80px;top:236px;font-size:136px">Tu página,<br>lista en<br><span class="hand ring" style="font-size:1.25em;letter-spacing:0;line-height:1.1">minutos.<svg class="ringsvg" viewBox="0 0 600 200" preserveAspectRatio="none" aria-hidden="true"><path d="M30 104C20 40 150 16 300 18C450 20 590 46 578 104C566 166 430 186 290 182C150 178 16 160 28 98C34 60 110 34 230 26" fill="none" stroke="#1D2B24" stroke-width="5" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg></span></h1>

  <p class="a" style="left:80px;top:700px;width:860px;font-size:40px;line-height:1.36">Elige una plantilla, edita por bloques y publica cuando quieras.</p>

  <div class="pill">Elige · Edita · Publica</div>

  <svg class="grain" aria-hidden="true"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
</div>
</body>
</html>
