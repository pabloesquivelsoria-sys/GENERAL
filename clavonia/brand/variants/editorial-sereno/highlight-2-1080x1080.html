<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Clavonia destacado Cómo funciona</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&display=swap" rel="stylesheet">
<style>
:root{--ink:#111111;--paper:#F4F2EE;--blue:#2F4B7C}
html,body{margin:0;padding:0;background:#F4F2EE}
.root{position:relative;width:1080px;height:1080px;overflow:hidden;background:var(--paper);color:var(--ink)}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
h1{font-family:Fraunces,serif;font-weight:400;font-size:200px;line-height:.96;letter-spacing:-0.03em;margin:0;text-align:center;white-space:nowrap}
.cur{display:inline-block;width:.07em;height:.72em;background:var(--blue);margin-left:.05em}
</style>
</head>
<body>
<div class="root">
  <div class="center">
    <h1>Cómo<br>funciona<span class="cur"></span></h1>
  </div>
</div>
</body>
</html>
