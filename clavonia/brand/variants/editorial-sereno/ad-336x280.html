<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Clavonia anuncio 336x280</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Manrope:wght@400..800&display=swap" rel="stylesheet">
<style>
:root{--ink:#111111;--paper:#F4F2EE;--blue:#2F4B7C;--soft:#D9D5CC}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#F4F2EE}
.root{position:relative;width:336px;height:280px;overflow:hidden;background:var(--paper);color:var(--ink);font-family:Manrope,sans-serif;outline:1px solid var(--soft);outline-offset:-1px}
.word{font-family:Fraunces,serif;font-weight:500;letter-spacing:-0.02em;line-height:1}
.brand{position:absolute;left:22px;top:20px;display:flex;align-items:center;gap:8px}
h1{position:absolute;left:22px;top:70px;font-family:Fraunces,serif;font-weight:400;font-size:36px;line-height:1;letter-spacing:-0.02em;margin:0}
.cta{position:absolute;left:22px;top:212px;height:46px;padding:0 18px;display:flex;align-items:center;background:var(--blue);color:var(--paper);font-size:16px;font-weight:700}
.mock{position:absolute;border:1.5px solid var(--ink);background:var(--paper)}
.mh{position:absolute;left:10%;top:10%;width:56%;height:9%;background:var(--ink)}
.ml{position:absolute;left:10%;height:4%;background:var(--soft)}
.mb{position:absolute;left:10%;right:10%;top:44%;height:32%;border:1.5px solid var(--blue)}
.mc{position:absolute;left:10%;top:22%;width:3px;height:56%;background:var(--blue)}
</style>
</head>
<body>
<div class="root">
  <div class="brand">
    <svg width="30" height="30" viewBox="0 0 64 64" aria-hidden="true"><path d="M46.14 15.15A22 22 0 1 0 46.14 48.85" fill="none" stroke="#111111" stroke-width="2.4"/><rect x="40" y="21" width="4" height="22" fill="#2F4B7C"/></svg>
    <span class="word" style="font-size:24px">clavonia</span>
  </div>
  <h1>Tu página,<br>lista en<br>minutos.</h1>
  <div class="mock" style="left:200px;top:72px;width:114px;height:116px" aria-hidden="true">
    <div class="mh"></div><div class="ml" style="top:26%;width:80%"></div><div class="ml" style="top:34%;width:62%"></div>
    <div class="mb"><div class="mc"></div></div>
  </div>
  <div class="cta">Crear mi página</div>
</div>
</body>
</html>
