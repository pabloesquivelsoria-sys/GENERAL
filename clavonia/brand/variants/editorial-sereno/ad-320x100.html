<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Clavonia anuncio 320x100</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Manrope:wght@400..800&display=swap" rel="stylesheet">
<style>
:root{--ink:#111111;--paper:#F4F2EE;--blue:#2F4B7C;--soft:#D9D5CC}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#F4F2EE}
.root{position:relative;width:320px;height:100px;overflow:hidden;background:var(--paper);color:var(--ink);font-family:Manrope,sans-serif;outline:1px solid var(--soft);outline-offset:-1px}
.word{font-family:Fraunces,serif;font-weight:500;letter-spacing:-0.02em;line-height:1}
.brand{position:absolute;left:14px;top:12px;display:flex;align-items:center;gap:6px}
h1{position:absolute;left:14px;top:42px;font-family:Fraunces,serif;font-weight:400;font-size:20px;line-height:1.05;letter-spacing:-0.01em;margin:0}
.cta{position:absolute;right:14px;top:28px;height:44px;padding:0 14px;display:flex;align-items:center;background:var(--blue);color:var(--paper);font-size:16px;font-weight:700}
</style>
</head>
<body>
<div class="root">
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 64 64" aria-hidden="true"><path d="M46.14 15.15A22 22 0 1 0 46.14 48.85" fill="none" stroke="#111111" stroke-width="3"/><rect x="40" y="21" width="5" height="22" fill="#2F4B7C"/></svg>
    <span class="word" style="font-size:18px">clavonia</span>
  </div>
  <h1>Tu página,<br>lista en minutos.</h1>
  <div class="cta">Empieza hoy</div>
</div>
</body>
</html>
