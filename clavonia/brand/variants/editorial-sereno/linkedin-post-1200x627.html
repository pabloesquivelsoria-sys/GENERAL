<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Clavonia publicación LinkedIn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Manrope:wght@400..800&display=swap" rel="stylesheet">
<style>
:root{--ink:#111111;--paper:#F4F2EE;--blue:#2F4B7C;--grey:#5F6670}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#F4F2EE}
.root{position:relative;width:1200px;height:627px;overflow:hidden;background:var(--paper);color:var(--ink);font-family:Manrope,sans-serif}
.word{font-family:Fraunces,serif;font-weight:500;letter-spacing:-0.02em;line-height:1}
.brand{position:absolute;left:72px;top:52px;display:flex;align-items:center;gap:12px}
.kicker{position:absolute;right:72px;top:66px;font-size:16px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--grey)}
.rule{position:absolute;left:72px;right:72px;border-top:1.5px solid var(--ink)}
h1{position:absolute;left:72px;top:158px;font-family:Fraunces,serif;font-weight:400;font-size:96px;line-height:1;letter-spacing:-0.025em;margin:0}
.cur{display:inline-block;width:.07em;height:.72em;background:var(--blue);margin-left:.06em}
.sub{position:absolute;left:72px;top:380px;margin:0;font-size:26px;line-height:1.4;font-weight:500;color:var(--grey)}
.verbs{position:absolute;left:72px;top:512px;display:flex;gap:28px;font-family:Fraunces,serif;font-size:40px;line-height:1;letter-spacing:-0.02em}
.dot{color:var(--blue)}
.cta{position:absolute;right:72px;top:502px;height:56px;padding:0 28px;display:flex;align-items:center;background:var(--blue);color:var(--paper);font-size:19px;font-weight:700}
</style>
</head>
<body>
<div class="root">
  <div class="brand">
    <svg width="44" height="44" viewBox="0 0 64 64" aria-hidden="true"><path d="M46.14 15.15A22 22 0 1 0 46.14 48.85" fill="none" stroke="#111111" stroke-width="1.8"/><rect x="40" y="21" width="4" height="22" fill="#2F4B7C"/></svg>
    <span class="word" style="font-size:34px">clavonia</span>
  </div>
  <div class="kicker">Plantillas para emprendedores</div>
  <div class="rule" style="top:124px"></div>
  <h1>Tu página,<br>lista en minutos.<span class="cur"></span></h1>
  <p class="sub">Elige una plantilla, edita por bloques y publica cuando quieras.</p>
  <div class="rule" style="top:478px"></div>
  <div class="verbs"><span>Elige<span class="dot">.</span></span><span>Edita<span class="dot">.</span></span><span>Publica<span class="dot">.</span></span></div>
  <div class="cta">Empieza hoy</div>
</div>
</body>
</html>
