<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Clavonia portada TikTok</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Manrope:wght@400..800&display=swap" rel="stylesheet">
<style>
/* TikTok UI covers the right 120px and the bottom 400px: text stays in x 72-960, y 230-1340. */
:root{--ink:#111111;--paper:#F4F2EE;--blue:#2F4B7C;--grey:#5F6670}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#F4F2EE}
.root{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--paper);color:var(--ink);font-family:Manrope,sans-serif}
.word{font-family:Fraunces,serif;font-weight:500;letter-spacing:-0.02em;line-height:1}
.brand{position:absolute;left:72px;top:230px;display:flex;align-items:center;gap:16px}
.rule{position:absolute;left:72px;width:888px;border-top:1.5px solid var(--ink)}
h1{position:absolute;left:72px;top:460px;font-family:Fraunces,serif;font-weight:400;font-size:176px;line-height:.96;letter-spacing:-0.03em;margin:0}
.cur{display:inline-block;width:.07em;height:.72em;background:var(--blue);margin-left:.05em}
.sub{position:absolute;left:72px;top:1030px;width:820px;margin:0;font-size:40px;line-height:1.38;font-weight:500;color:var(--grey)}
.verbs{position:absolute;left:72px;top:1222px;display:flex;gap:34px;font-family:Fraunces,serif;font-size:64px;line-height:1;letter-spacing:-0.02em}
.dot{color:var(--blue)}
</style>
</head>
<body>
<div class="root">
  <div class="brand">
    <svg width="60" height="60" viewBox="0 0 64 64" aria-hidden="true"><path d="M46.14 15.15A22 22 0 1 0 46.14 48.85" fill="none" stroke="#111111" stroke-width="1.8"/><rect x="40" y="21" width="4" height="22" fill="#2F4B7C"/></svg>
    <span class="word" style="font-size:50px">clavonia</span>
  </div>
  <div class="rule" style="top:336px"></div>
  <h1>Tu página,<br>lista en<br>minutos.<span class="cur"></span></h1>
  <p class="sub">Elige una plantilla, edita por bloques y publica cuando quieras.</p>
  <div class="rule" style="top:1180px"></div>
  <div class="verbs"><span>Elige<span class="dot">.</span></span><span>Edita<span class="dot">.</span></span><span>Publica<span class="dot">.</span></span></div>
</div>
</body>
</html>
