<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Clavonia banner LinkedIn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Manrope:wght@400..800&display=swap" rel="stylesheet">
<style>
/* Personal profile: the avatar covers the left ~400px on desktop, so all text starts at x 480. */
:root{--ink:#111111;--paper:#F4F2EE;--blue:#2F4B7C;--grey:#5F6670;--soft:#D9D5CC}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#F4F2EE}
.root{position:relative;width:1584px;height:396px;overflow:hidden;background:var(--paper);color:var(--ink);font-family:Manrope,sans-serif}
.word{font-family:Fraunces,serif;font-weight:500;letter-spacing:-0.02em;line-height:1}
.brand{position:absolute;right:72px;top:52px;display:flex;align-items:center;gap:12px}
.vr{position:absolute;left:440px;top:56px;height:284px;border-left:1.5px solid var(--ink)}
.copy{position:absolute;left:480px;top:112px}
h1{font-family:Fraunces,serif;font-weight:400;font-size:64px;line-height:1.05;letter-spacing:-0.02em;margin:0;white-space:nowrap}
.cur{display:inline-block;width:.07em;height:.72em;background:var(--blue);margin-left:.06em}
.sub{margin:18px 0 0;font-size:22px;line-height:1.45;font-weight:500;color:var(--grey)}
.rule{position:absolute;left:480px;right:72px;top:290px;border-top:1.5px solid var(--ink)}
.kicker{position:absolute;left:480px;top:312px;font-size:16px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--grey)}
</style>
</head>
<body>
<div class="root">
  <div class="brand">
    <svg width="40" height="40" viewBox="0 0 64 64" aria-hidden="true"><path d="M46.14 15.15A22 22 0 1 0 46.14 48.85" fill="none" stroke="#111111" stroke-width="1.8"/><rect x="40" y="21" width="4" height="22" fill="#2F4B7C"/></svg>
    <span class="word" style="font-size:32px">clavonia</span>
  </div>
  <div class="vr"></div>
  <div class="copy">
    <h1>Tu página, lista en minutos.<span class="cur"></span></h1>
    <p class="sub">Elige una plantilla, edita por bloques y publica cuando quieras.</p>
  </div>
  <div class="rule"></div>
  <div class="kicker">Plantillas para emprendedores</div>
</div>
</body>
</html>
