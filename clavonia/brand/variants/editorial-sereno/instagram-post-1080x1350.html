<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Clavonia post 4:5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Manrope:wght@400..700&display=swap" rel="stylesheet">
<style>
:root{--ink:#111111;--paper:#F4F2EE;--blue:#2F4B7C;--grey:#5F6670}
html,body{margin:0;padding:0;background:#F4F2EE}
.root{position:relative;width:1080px;height:1350px;overflow:hidden;background:var(--paper);color:var(--ink);font-family:Manrope,sans-serif}
.top{position:absolute;left:88px;right:88px;top:84px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:16px}
.mark{width:58px;height:58px;display:block}
.word{font-family:Fraunces,serif;font-weight:500;font-size:46px;letter-spacing:-0.02em;line-height:1}
.kicker{font-size:19px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--grey)}
.rule{position:absolute;left:88px;right:88px;height:0;border-top:1.5px solid var(--ink)}
.head{position:absolute;left:88px;top:292px;width:904px}
h1{font-family:Fraunces,serif;font-weight:400;font-size:176px;line-height:.96;letter-spacing:-0.03em;margin:0}
.cur{display:inline-block;width:.07em;height:.72em;background:var(--blue);margin-left:.05em}
.sub{position:absolute;left:88px;top:842px;width:700px;margin:0;font-size:36px;line-height:1.4;font-weight:500;color:var(--grey)}
.verbs{position:absolute;left:88px;top:1150px;display:flex;gap:44px;font-family:Fraunces,serif;font-weight:400;font-size:84px;line-height:1;letter-spacing:-0.02em}
.dot{color:var(--blue)}
</style>
</head>
<body>
<div class="root">
  <div class="top">
    <div class="brand">
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
        <path d="M46.14 15.15A22 22 0 1 0 46.14 48.85" fill="none" stroke="#111111" stroke-width="1.8"/>
        <rect x="40" y="21" width="4" height="22" fill="#2F4B7C"/>
      </svg>
      <span class="word">clavonia</span>
    </div>
    <div class="kicker">Plantillas para emprendedores</div>
  </div>
  <div class="rule" style="top:186px"></div>
  <h1 class="head">Tu página,<br>lista en<br>minutos.<span class="cur"></span></h1>
  <p class="sub">Elige una plantilla, edita por bloques y publica cuando quieras.</p>
  <div class="rule" style="top:1100px"></div>
  <div class="verbs"><span>Elige<span class="dot">.</span></span><span>Edita<span class="dot">.</span></span><span>Publica<span class="dot">.</span></span></div>
</div>
</body>
</html>
