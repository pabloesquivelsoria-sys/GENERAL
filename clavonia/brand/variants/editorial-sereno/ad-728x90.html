<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Clavonia anuncio 728x90</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Manrope:wght@400..800&display=swap" rel="stylesheet">
<style>
:root{--ink:#111111;--paper:#F4F2EE;--blue:#2F4B7C;--soft:#D9D5CC}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#F4F2EE}
.root{position:relative;width:728px;height:90px;overflow:hidden;background:var(--paper);color:var(--ink);font-family:Manrope,sans-serif;outline:1px solid var(--soft);outline-offset:-1px}
.word{font-family:Fraunces,serif;font-weight:500;letter-spacing:-0.02em;line-height:1}
.brand{position:absolute;left:18px;top:0;height:90px;display:flex;align-items:center;gap:8px}
.vr{position:absolute;left:174px;top:20px;height:50px;border-left:1.5px solid var(--ink)}
h1{position:absolute;left:192px;top:0;height:90px;display:flex;align-items:center;font-family:Fraunces,serif;font-weight:400;font-size:28px;line-height:1;letter-spacing:-0.02em;margin:0;white-space:nowrap}
.cta{position:absolute;right:18px;top:23px;height:44px;padding:0 16px;display:flex;align-items:center;background:var(--blue);color:var(--paper);font-size:16px;font-weight:700}
</style>
</head>
<body>
<div class="root">
  <div class="brand">
    <svg width="32" height="32" viewBox="0 0 64 64" aria-hidden="true"><path d="M46.14 15.15A22 22 0 1 0 46.14 48.85" fill="none" stroke="#111111" stroke-width="2.4"/><rect x="40" y="21" width="4" height="22" fill="#2F4B7C"/></svg>
    <span class="word" style="font-size:26px">clavonia</span>
  </div>
  <div class="vr"></div>
  <h1>Tu página, lista en minutos.</h1>
  <div class="cta">Crear mi página</div>
</div>
</body>
</html>
