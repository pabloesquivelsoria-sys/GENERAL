<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Clavonia anuncio 300x600</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Manrope:wght@400..800&display=swap" rel="stylesheet">
<style>
:root{--ink:#111111;--paper:#F4F2EE;--blue:#2F4B7C;--soft:#D9D5CC}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#F4F2EE}
.root{position:relative;width:300px;height:600px;overflow:hidden;background:var(--paper);color:var(--ink);font-family:Manrope,sans-serif;outline:1px solid var(--soft);outline-offset:-1px}
.word{font-family:Fraunces,serif;font-weight:500;letter-spacing:-0.02em;line-height:1}
.brand{position:absolute;left:28px;top:30px;display:flex;align-items:center;gap:9px}
.rule{position:absolute;left:28px;right:28px;top:88px;border-top:1.5px solid var(--ink)}
h1{position:absolute;left:28px;top:116px;font-family:Fraunces,serif;font-weight:400;font-size:50px;line-height:.98;letter-spacing:-0.025em;margin:0}
.cur{display:inline-block;width:.07em;height:.72em;background:var(--blue);margin-left:.05em}
.mock{position:absolute;border:1.5px solid var(--ink);background:var(--paper)}
.mh{position:absolute;left:8%;top:9%;width:56%;height:8%;background:var(--ink)}
.ml{position:absolute;left:8%;height:3.4%;background:var(--soft)}
.mb{position:absolute;left:8%;right:8%;top:42%;height:30%;border:1.5px solid var(--blue)}
.mc{position:absolute;left:6%;top:22%;width:4px;height:50%;background:var(--blue)}
.mbl{position:absolute;left:14%;height:10%;background:var(--soft)}
.mx{position:absolute;left:8%;top:80%;width:36%;height:9%;background:var(--soft)}
.cta{position:absolute;left:28px;right:28px;top:520px;height:52px;display:flex;align-items:center;justify-content:center;background:var(--blue);color:var(--paper);font-size:18px;font-weight:700}
</style>
</head>
<body>
<div class="root">
  <div class="brand">
    <svg width="36" height="36" viewBox="0 0 64 64" aria-hidden="true"><path d="M46.14 15.15A22 22 0 1 0 46.14 48.85" fill="none" stroke="#111111" stroke-width="2.2"/><rect x="40" y="21" width="4" height="22" fill="#2F4B7C"/></svg>
    <span class="word" style="font-size:30px">clavonia</span>
  </div>
  <div class="rule"></div>
  <h1>Tu página,<br>lista en<br>minutos.<span class="cur"></span></h1>
  <div class="mock" style="left:28px;top:300px;width:244px;height:190px" aria-hidden="true">
    <div class="mh"></div><div class="ml" style="top:22%;width:80%"></div><div class="ml" style="top:30%;width:64%"></div>
    <div class="mb"><div class="mc"></div><div class="mbl" style="top:26%;width:60%"></div><div class="mbl" style="top:58%;width:44%"></div></div>
    <div class="mx"></div>
  </div>
  <div class="cta">Crear mi página</div>
</div>
</body>
</html>
