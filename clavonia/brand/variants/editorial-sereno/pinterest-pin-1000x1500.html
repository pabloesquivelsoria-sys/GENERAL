<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Clavonia pin Pinterest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Manrope:wght@400..800&display=swap" rel="stylesheet">
<style>
:root{--ink:#111111;--paper:#F4F2EE;--blue:#2F4B7C;--grey:#5F6670;--soft:#D9D5CC}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#F4F2EE}
.root{position:relative;width:1000px;height:1500px;overflow:hidden;background:var(--paper);color:var(--ink);font-family:Manrope,sans-serif}
.word{font-family:Fraunces,serif;font-weight:500;letter-spacing:-0.02em;line-height:1}
.brand{position:absolute;left:80px;top:76px;display:flex;align-items:center;gap:14px}
.rule{position:absolute;left:80px;right:80px;top:170px;border-top:1.5px solid var(--ink)}
h1{position:absolute;left:80px;top:226px;font-family:Fraunces,serif;font-weight:400;font-size:132px;line-height:.97;letter-spacing:-0.03em;margin:0}
.cur{display:inline-block;width:.07em;height:.72em;background:var(--blue);margin-left:.05em}
.sub{position:absolute;left:80px;top:650px;width:780px;margin:0;font-size:34px;line-height:1.4;font-weight:500;color:var(--grey)}
.mock{position:absolute;border:1.5px solid var(--ink);background:var(--paper)}
.mh{position:absolute;left:6%;top:9%;width:44%;height:8%;background:var(--ink)}
.ml{position:absolute;left:6%;height:3%;background:var(--soft)}
.mb{position:absolute;left:6%;width:54%;top:42%;height:40%;border:1.5px solid var(--blue)}
.mc{position:absolute;left:6%;top:22%;width:6px;height:44%;background:var(--blue)}
.mbl{position:absolute;left:14%;height:8%;background:var(--soft)}
.mt{position:absolute;top:42%;height:40%;width:14%;background:var(--soft)}
.cta{position:absolute;left:80px;top:1274px;height:76px;padding:0 40px;display:flex;align-items:center;background:var(--blue);color:var(--paper);font-size:28px;font-weight:700}
</style>
</head>
<body>
<div class="root">
  <div class="brand">
    <svg width="56" height="56" viewBox="0 0 64 64" aria-hidden="true"><path d="M46.14 15.15A22 22 0 1 0 46.14 48.85" fill="none" stroke="#111111" stroke-width="1.8"/><rect x="40" y="21" width="4" height="22" fill="#2F4B7C"/></svg>
    <span class="word" style="font-size:46px">clavonia</span>
  </div>
  <div class="rule"></div>
  <h1>Tu página,<br>lista en<br>minutos.<span class="cur"></span></h1>
  <p class="sub">Elige una plantilla, edita por bloques y publica cuando quieras.</p>
  <div class="mock" style="left:80px;top:820px;width:840px;height:390px" aria-hidden="true">
    <div class="mh"></div>
    <div class="ml" style="top:23%;width:70%"></div>
    <div class="ml" style="top:30%;width:56%"></div>
    <div class="mb"><div class="mc"></div><div class="mbl" style="top:24%;width:66%"></div><div class="mbl" style="top:45%;width:50%"></div><div class="mbl" style="top:66%;width:72%"></div></div>
    <div class="mt" style="left:64%"></div>
    <div class="mt" style="left:80%"></div>
  </div>
  <div class="cta">Crear mi página</div>
</div>
</body>
</html>
