<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Clavonia avatar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Manrope:wght@400..700&display=swap" rel="stylesheet">
<style>
:root{--ink:#111111;--paper:#F4F2EE;--blue:#2F4B7C;--grey:#5F6670}
html,body{margin:0;padding:0;background:#F4F2EE}
.root{position:relative;width:1080px;height:1080px;overflow:hidden;background:var(--paper);color:var(--ink)}
.stack{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:44px}
.mark{width:280px;height:280px;display:block}
.word{font-family:Fraunces,serif;font-weight:500;font-size:124px;line-height:1;letter-spacing:-0.02em}
</style>
</head>
<body>
<div class="root">
  <div class="stack">
    <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
      <path d="M46.14 15.15A22 22 0 1 0 46.14 48.85" fill="none" stroke="#111111" stroke-width="1.8"/>
      <rect x="37" y="22" width="4" height="20" fill="#2F4B7C"/>
    </svg>
    <div class="word">clavonia</div>
  </div>
</div>
</body>
</html>
