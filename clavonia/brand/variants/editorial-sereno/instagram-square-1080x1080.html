<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Clavonia cuadrado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Manrope:wght@400..700&display=swap" rel="stylesheet">
<style>
:root{--ink:#111111;--paper:#F4F2EE;--blue:#2F4B7C;--grey:#5F6670}
html,body{margin:0;padding:0;background:#F4F2EE}
.root{position:relative;width:1080px;height:1080px;overflow:hidden;background:var(--paper);color:var(--ink);font-family:Manrope,sans-serif}
.brand{position:absolute;left:80px;top:78px;display:flex;align-items:center;gap:14px}
.mark{width:50px;height:50px;display:block}
.word{font-family:Fraunces,serif;font-weight:500;font-size:40px;letter-spacing:-0.02em;line-height:1}
.rule{position:absolute;left:80px;right:80px;height:0;border-top:1.5px solid var(--ink)}
.head{position:absolute;left:80px;top:226px;width:920px}
h1{font-family:Fraunces,serif;font-weight:400;font-size:152px;line-height:.97;letter-spacing:-0.03em;margin:0}
.cur{display:inline-block;width:.07em;height:.72em;background:var(--blue);margin-left:.05em}
.sub{position:absolute;left:80px;top:712px;width:780px;margin:0;font-size:32px;line-height:1.4;font-weight:500;color:var(--grey)}
.kicker{position:absolute;left:80px;top:944px;font-size:19px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--grey)}
</style>
</head>
<body>
<div class="root">
  <div class="brand">
    <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
      <path d="M46.14 15.15A22 22 0 1 0 46.14 48.85" fill="none" stroke="#111111" stroke-width="1.8"/>
      <rect x="37" y="22" width="4" height="20" fill="#2F4B7C"/>
    </svg>
    <span class="word">clavonia</span>
  </div>
  <div class="rule" style="top:166px"></div>
  <h1 class="head">Tu página,<br>lista en<br>minutos.<span class="cur"></span></h1>
  <p class="sub">Elige una plantilla, edita por bloques y publica cuando quieras.</p>
  <div class="rule" style="top:920px"></div>
  <div class="kicker">Plantillas para emprendedores</div>
</div>
</body>
</html>
