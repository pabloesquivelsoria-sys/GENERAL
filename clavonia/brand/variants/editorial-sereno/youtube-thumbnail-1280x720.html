<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Clavonia miniatura YouTube</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Manrope:wght@400..800&display=swap" rel="stylesheet">
<style>
/* Bottom-right is left free for the video timestamp. */
:root{--ink:#111111;--paper:#F4F2EE;--blue:#2F4B7C;--grey:#5F6670;--soft:#D9D5CC}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#F4F2EE}
.root{position:relative;width:1280px;height:720px;overflow:hidden;background:var(--paper);color:var(--ink);font-family:Manrope,sans-serif}
.word{font-family:Fraunces,serif;font-weight:500;letter-spacing:-0.02em;line-height:1}
.brand{position:absolute;left:64px;top:52px;display:flex;align-items:center;gap:12px}
h1{position:absolute;left:64px;top:130px;font-family:Fraunces,serif;font-weight:400;font-size:150px;line-height:.97;letter-spacing:-0.03em;margin:0}
.cur{display:inline-block;width:.07em;height:.72em;background:var(--blue);margin-left:.05em}
.verbs{position:absolute;left:64px;top:610px;display:flex;gap:26px;font-family:Fraunces,serif;font-size:42px;line-height:1;letter-spacing:-0.02em}
.dot{color:var(--blue)}
.mock{position:absolute;border:2px solid var(--ink);background:var(--paper)}
.mh{position:absolute;left:9%;top:8%;width:56%;height:7%;background:var(--ink)}
.ml{position:absolute;left:9%;height:3%;background:var(--soft)}
.mb{position:absolute;left:9%;right:9%;top:38%;height:30%;border:2px solid var(--blue)}
.mc{position:absolute;left:6%;top:22%;width:7px;height:46%;background:var(--blue)}
.mbl{position:absolute;left:14%;height:9%;background:var(--soft)}
.mx{position:absolute;left:9%;top:78%;width:36%;height:10%;background:var(--blue)}
</style>
</head>
<body>
<div class="root">
  <div class="brand">
    <svg width="48" height="48" viewBox="0 0 64 64" aria-hidden="true"><path d="M46.14 15.15A22 22 0 1 0 46.14 48.85" fill="none" stroke="#111111" stroke-width="1.8"/><rect x="40" y="21" width="4" height="22" fill="#2F4B7C"/></svg>
    <span class="word" style="font-size:40px">clavonia</span>
  </div>
  <h1>Tu página,<br>lista en<br>minutos.<span class="cur"></span></h1>
  <div class="verbs"><span>Elige<span class="dot">.</span></span><span>Edita<span class="dot">.</span></span><span>Publica<span class="dot">.</span></span></div>
  <div class="mock" style="left:800px;top:100px;width:416px;height:470px" aria-hidden="true">
    <div class="mh"></div>
    <div class="ml" style="top:20%;width:82%"></div>
    <div class="ml" style="top:26%;width:74%"></div>
    <div class="ml" style="top:32%;width:58%"></div>
    <div class="mb"><div class="mc"></div><div class="mbl" style="top:24%;width:64%"></div><div class="mbl" style="top:45%;width:50%"></div><div class="mbl" style="top:66%;width:70%"></div></div>
    <div class="mx"></div>
  </div>
</div>
</body>
</html>
