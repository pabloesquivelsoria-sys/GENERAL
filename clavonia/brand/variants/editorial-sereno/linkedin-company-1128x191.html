<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Clavonia portada LinkedIn empresa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Manrope:wght@400..800&display=swap" rel="stylesheet">
<style>
/* Content starts at x 220 to stay clear of the company logo that overlaps the bottom-left. */
:root{--ink:#111111;--paper:#F4F2EE;--blue:#2F4B7C;--grey:#5F6670}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#F4F2EE}
.root{position:relative;width:1128px;height:191px;overflow:hidden;background:var(--paper);color:var(--ink);font-family:Manrope,sans-serif}
.word{font-family:Fraunces,serif;font-weight:500;letter-spacing:-0.02em;line-height:1}
.brand{position:absolute;left:220px;top:0;height:191px;display:flex;align-items:center;gap:12px}
.vr{position:absolute;left:500px;top:48px;height:95px;border-left:1.5px solid var(--ink)}
h1{position:absolute;left:536px;top:0;height:191px;display:flex;align-items:center;font-family:Fraunces,serif;font-weight:400;font-size:44px;line-height:1;letter-spacing:-0.02em;margin:0;white-space:nowrap}
.cur{display:inline-block;width:.07em;height:.72em;background:var(--blue);margin-left:.06em}
</style>
</head>
<body>
<div class="root">
  <div class="brand">
    <svg width="52" height="52" viewBox="0 0 64 64" aria-hidden="true"><path d="M46.14 15.15A22 22 0 1 0 46.14 48.85" fill="none" stroke="#111111" stroke-width="1.8"/><rect x="40" y="21" width="4" height="22" fill="#2F4B7C"/></svg>
    <span class="word" style="font-size:42px">clavonia</span>
  </div>
  <div class="vr"></div>
  <h1>Tu página, lista en minutos.<span class="cur"></span></h1>
</div>
</body>
</html>
