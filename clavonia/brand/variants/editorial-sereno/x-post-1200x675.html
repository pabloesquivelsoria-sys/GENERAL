<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Clavonia publicación X</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Manrope:wght@400..800&display=swap" rel="stylesheet">
<style>
:root{--ink:#111111;--paper:#F4F2EE;--blue:#2F4B7C;--grey:#5F6670;--soft:#D9D5CC}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#F4F2EE}
.root{position:relative;width:1200px;height:675px;overflow:hidden;background:var(--paper);color:var(--ink);font-family:Manrope,sans-serif}
.word{font-family:Fraunces,serif;font-weight:500;letter-spacing:-0.02em;line-height:1}
.brand{position:absolute;left:72px;top:56px;display:flex;align-items:center;gap:12px}
h1{position:absolute;left:72px;top:140px;font-family:Fraunces,serif;font-weight:400;font-size:90px;line-height:1;letter-spacing:-0.025em;margin:0}
.cur{display:inline-block;width:.07em;height:.72em;background:var(--blue);margin-left:.06em}
.sub{position:absolute;left:72px;top:434px;width:560px;margin:0;font-size:25px;line-height:1.45;font-weight:500;color:var(--grey)}
.cta{position:absolute;left:72px;top:548px;height:56px;padding:0 28px;display:flex;align-items:center;background:var(--blue);color:var(--paper);font-size:19px;font-weight:700}
.mock{position:absolute;border:1.5px solid var(--ink);background:var(--paper)}
.mh{position:absolute;left:8%;top:7%;width:56%;height:6%;background:var(--ink)}
.ml{position:absolute;left:8%;height:2.4%;background:var(--soft)}
.mb{position:absolute;left:8%;right:8%;top:36%;height:30%;border:1.5px solid var(--blue)}
.mc{position:absolute;left:6%;top:22%;width:5px;height:42%;background:var(--blue)}
.mbl{position:absolute;left:14%;height:8%;background:var(--soft)}
.mx{position:absolute;left:8%;top:76%;width:38%;height:10%;background:var(--blue)}
</style>
</head>
<body>
<div class="root">
  <div class="brand">
    <svg width="44" height="44" viewBox="0 0 64 64" aria-hidden="true"><path d="M46.14 15.15A22 22 0 1 0 46.14 48.85" fill="none" stroke="#111111" stroke-width="1.8"/><rect x="40" y="21" width="4" height="22" fill="#2F4B7C"/></svg>
    <span class="word" style="font-size:34px">clavonia</span>
  </div>
  <h1>Tu página,<br>lista en<br>minutos.<span class="cur"></span></h1>
  <p class="sub">Elige una plantilla, edita por bloques y publica cuando quieras.</p>
  <div class="cta">Crear mi página</div>
  <div class="mock" style="left:752px;top:100px;width:376px;height:475px" aria-hidden="true">
    <div class="mh"></div>
    <div class="ml" style="top:18%;width:84%"></div>
    <div class="ml" style="top:23%;width:78%"></div>
    <div class="ml" style="top:28%;width:62%"></div>
    <div class="mb"><div class="mc"></div><div class="mbl" style="top:24%;width:66%"></div><div class="mbl" style="top:44%;width:52%"></div><div class="mbl" style="top:64%;width:72%"></div></div>
    <div class="mx"></div>
  </div>
</div>
</body>
</html>
