<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700&family=Sora:wght@600;700&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1500px;height:500px;overflow:hidden;background:#0F1B2D}
body{font-family:Manrope,system-ui,sans-serif;color:#0F1B2D;position:relative}
.wm{font-family:Sora,system-ui,sans-serif;font-weight:700;letter-spacing:-0.02em;line-height:1}
h1{font-family:Sora,system-ui,sans-serif;font-weight:700;letter-spacing:-0.03em;line-height:1.05}
p{line-height:1.4}
.abs{position:absolute}
.card{background:#FFFFFF;border-radius:18px;box-shadow:0 1px 0 rgba(15,27,45,.06),0 8px 24px rgba(15,27,45,.08)}
.bar{height:14px;border-radius:7px;background:#DCE3EE}
.bar.ink{background:#0F1B2D}
.btn{display:inline-block;background:#2BD4A3;color:#0F1B2D;font-weight:700;border-radius:12px;padding:0 28px;height:64px;line-height:64px}

</style></head><body><div class="abs" style="left:0;top:0;width:1500px;height:500px;background:#0F1B2D">
  <div class="abs" style="left:130px;top:120px;width:640px;color:#F6F8FB">
    <div style="display:flex;align-items:center;gap:18px;margin-bottom:36px"><svg width="56" height="56" viewBox="0 0 64 64" aria-hidden="true">
<rect x="6" y="6" width="46" height="13" rx="4" fill="#F6F8FB"/>
<rect x="6" y="6" width="13" height="52" rx="4" fill="#F6F8FB"/>
<rect x="6" y="45" width="46" height="13" rx="4" fill="#F6F8FB"/>
<rect x="42" y="23" width="9" height="18" rx="3" fill="#2BD4A3"/></svg><span class="wm" style="color:#F6F8FB;font-size:36px">clavonia</span></div>
    <h1 style="font-size:56px;margin-bottom:20px">Tu página, lista en minutos.</h1>
    <p style="font-size:24px;color:#C5CEDB">Landing pages y sitios para emprendedores.</p>
  </div>
  <div class="abs" style="left:1040px;top:70px"><div class="abs" style="left:0;top:0;width:251px">
  <div class="card" style="padding:15px;margin-bottom:11px">
    <div class="bar ink" style="width:70%;height:12px;margin-bottom:8px"></div>
    <div class="bar" style="width:92%;margin-bottom:5px"></div>
    <div class="bar" style="width:60%;margin-bottom:12px"></div>
    <div style="display:inline-block;background:#F6F8FB;border-radius:7px;height:28px;width:91px"></div>
  </div>
  <div class="card" style="padding:15px;margin-bottom:11px;display:flex;gap:8px">
    <div style="flex:1;height:54px;border-radius:8px;background:#1E2D44"></div>
    <div style="flex:1;height:54px;border-radius:8px;background:#1E2D44"></div>
    <div style="flex:1;height:54px;border-radius:8px;background:#1E2D44"></div>
  </div>
  <div class="card" style="padding:15px;display:flex;align-items:center;justify-content:space-between">
    <div class="bar" style="width:55%"></div>
    <div style="width:9px;height:23px;border-radius:4px;background:#2BD4A3"></div>
  </div>
</div></div>
</div></body></html>
