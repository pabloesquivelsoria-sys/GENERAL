<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700&family=Sora:wght@600;700&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0F1B2D}
body{font-family:Manrope,system-ui,sans-serif;color:#0F1B2D;position:relative}
.wm{font-family:Sora,system-ui,sans-serif;font-weight:700;letter-spacing:-0.02em;line-height:1}
h1{font-family:Sora,system-ui,sans-serif;font-weight:700;letter-spacing:-0.03em;line-height:1.05}
p{line-height:1.4}
.abs{position:absolute}
.card{background:#FFFFFF;border-radius:18px;box-shadow:0 1px 0 rgba(15,27,45,.06),0 8px 24px rgba(15,27,45,.08)}
.bar{height:14px;border-radius:7px;background:#DCE3EE}
.bar.ink{background:#0F1B2D}
.btn{display:inline-block;background:#2BD4A3;color:#0F1B2D;font-weight:700;border-radius:12px;padding:0 28px;height:64px;line-height:64px}

</style></head><body><div class="abs" style="left:0;top:0;width:1080px;height:1920px;background:#0F1B2D;color:#F6F8FB">
  <div class="abs" style="left:90px;top:260px"><svg width="60" height="60" viewBox="0 0 64 64" aria-hidden="true">
<rect x="6" y="6" width="46" height="13" rx="4" fill="#F6F8FB"/>
<rect x="6" y="6" width="13" height="52" rx="4" fill="#F6F8FB"/>
<rect x="6" y="45" width="46" height="13" rx="4" fill="#F6F8FB"/>
<rect x="42" y="23" width="9" height="18" rx="3" fill="#2BD4A3"/></svg></div>
  <div class="abs" style="left:90px;top:520px;width:900px">
    <h1 style="font-size:118px;margin-bottom:48px">Tu página, lista en minutos.</h1>
    <p style="font-size:42px;color:#C5CEDB;max-width:860px">Elige una plantilla, edita por bloques y publica cuando quieras.</p>
  </div>
  <div class="abs" style="left:90px;top:1180px;width:900px">
    <div class="card" style="background:#1E2D44;box-shadow:none;padding:40px 44px;display:flex;flex-direction:column;gap:22px">
      <div style="height:22px;width:60%;border-radius:11px;background:#F6F8FB"></div>
      <div style="height:16px;width:90%;border-radius:8px;background:#34445E"></div>
      <div style="height:16px;width:70%;border-radius:8px;background:#34445E"></div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:14px">
        <div style="height:64px;width:300px;border-radius:12px;background:#2BD4A3"></div>
        <div style="width:14px;height:44px;border-radius:6px;background:#2BD4A3"></div>
      </div>
    </div>
  </div>
  <div class="abs" style="left:90px;bottom:260px"><span class="btn" style="font-size:32px">Empieza hoy</span></div>
</div></body></html>
