<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1125">
<title>Dulce Methow card · Kraft front</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,500&display=swap">
<style>
  :root{--cream:#FAF6EB;--sage:#AEB594;--plum:#40273B;--sand:#D9C7AE}
  body{margin:0;background:var(--sand)}
  .card{position:relative;width:1125px;height:675px;overflow:hidden;background:var(--sand);color:var(--plum)}
  .layer{position:absolute;left:0;top:0}
  /* stamp centre (328, 337.5); badge drawn 304 px tall */
  .logo{position:absolute;left:164.6px;top:176.25px;width:330.5px;height:325.5px;object-fit:contain}
  /* single column line at x = 604, right edge at 1015 (110 px margin) */
  .col{position:absolute;left:604px;width:411px;top:0;height:675px;display:flex;flex-direction:column;justify-content:center}
  .name{margin:0;font-family:'Playfair Display',serif;font-style:italic;font-weight:400;font-size:54px;line-height:1;letter-spacing:.005em}
  .role{margin:18px 0 0;font-family:'Playfair Display',serif;font-weight:400;font-size:24px;line-height:1;letter-spacing:.28em;text-transform:uppercase}
  .rule{height:2px;background:var(--plum);margin:30px 0 26px;width:100%}
  .lines{margin:0;font-family:'Lora',serif;font-size:28px;line-height:1.55;display:grid;grid-template-columns:60px 1fr}
  .lines dt{font-family:'Lora',serif;font-weight:500;font-size:24px;letter-spacing:.14em;text-transform:uppercase;line-height:43.4px}
  .lines dd{margin:0}
</style>
</head>
<body>
<div class="card">
  <!-- subtle kraft grain -->
  <svg class="layer" width="1125" height="675" viewBox="0 0 1125 675" aria-hidden="true">
    <filter id="kraft" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="11"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.25  0 0 0 0 0.15  0 0 0 0 0.23  0 0 0 0.9 -0.36"/>
    </filter>
    <filter id="fibre" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.18" numOctaves="2" seed="4"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.98  0 0 0 0 0.96  0 0 0 0 0.92  0 0 0 0.9 -0.42"/>
    </filter>
    <rect width="1125" height="675" filter="url(#kraft)" opacity="0.16"/>
    <rect width="1125" height="675" filter="url(#fibre)" opacity="0.22"/>
  </svg>

  <!-- stamp: cream disc, 2 px solid ring, outer ring of evenly spaced dots (120 × 11.31 px = 2π·216) -->
  <svg class="layer" width="1125" height="675" viewBox="0 0 1125 675" aria-hidden="true">
    <circle cx="328" cy="337.5" r="200" fill="#FAF6EB" stroke="#40273B" stroke-width="2"/>
    <circle cx="328" cy="337.5" r="216" fill="none" stroke="#40273B" stroke-width="4.4"
            stroke-linecap="round" stroke-dasharray="0 11.309734" transform="rotate(-90 328 337.5)"/>
  </svg>

  <img class="logo" src="../../logo/dulce-methow-logo.png" alt="Dulce Methow · Mexican sweet bread &amp; desserts · Methow Valley">

  <div class="col">
    <p class="name">Owner Name</p>
    <p class="role">Baker &amp; Owner</p>
    <div class="rule"></div>
    <dl class="lines">
      <dt>T</dt><dd>(509) 555-0123</dd>
      <dt>E</dt><dd>hello@dulcemethow.com</dd>
      <dt>IG</dt><dd>@dulcemethow</dd>
      <dt>A</dt><dd>Riverside Ave<br>Winthrop, WA 98862</dd>
    </dl>
  </div>
</div>
</body>
</html>
