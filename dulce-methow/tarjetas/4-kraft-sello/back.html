<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1125">
<title>Dulce Methow card · Loyalty back</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,500&display=swap">
<style>
  :root{--cream:#FAF6EB;--sage:#AEB594;--sagedark:#66704F;--plum:#40273B}
  body{margin:0;background:var(--cream)}
  .card{position:relative;width:1125px;height:675px;overflow:hidden;background:var(--cream);color:var(--plum)}
  .layer{position:absolute;left:0;top:0}
  /* margins: x 110–1015, y 110–565 */
  .wordmark{position:absolute;left:110px;top:104px;margin:0;white-space:nowrap;line-height:1}
  .wordmark .d{font-family:'Playfair Display',serif;font-style:italic;font-size:40px}
  .wordmark .m{font-family:'Playfair Display',serif;font-size:24px;letter-spacing:.4em;margin-left:12px}
  .title{position:absolute;left:110px;top:243px;margin:0;font-family:'Playfair Display',serif;font-style:italic;font-weight:400;font-size:58px;line-height:1}
  .rules{position:absolute;left:110px;top:323px;margin:0;font-family:'Lora',serif;font-size:28px;line-height:1.55}
  .foot{position:absolute;left:110px;right:110px;bottom:110px;display:flex;justify-content:space-between;align-items:baseline;line-height:1}
  .name{margin:0;display:flex;align-items:baseline}
  .name .lab{font-family:'Lora',serif;font-weight:500;font-size:24px;letter-spacing:.22em;text-transform:uppercase;color:var(--sagedark)}
  .name .blank{display:inline-block;width:312px;height:2px;background:var(--plum);margin-left:16px}
  .handle{margin:0;font-family:'Lora',serif;font-size:28px;line-height:1}
  .num{font-family:'Lora',serif;font-size:24px;letter-spacing:.12em;fill:#66704F}
</style>
</head>
<body>
<div class="card">
  <p class="wordmark"><span class="d">dulce</span><span class="m">METHOW</span></p>

  <p class="title">Sweet rewards</p>
  <p class="rules">Buy 9 shell buns,<br>the 10th is on us.</p>

  <!-- stamp grid: 5 × 2, d = 81, gap 20 × 24, right edge on the 1015 margin -->
  <svg class="layer" width="1125" height="675" viewBox="0 0 1125 675" aria-hidden="true">
    <g fill="none" stroke="#40273B" stroke-width="2">
      <circle cx="570.5" cy="285.5" r="40.5"/>
      <circle cx="671.5" cy="285.5" r="40.5"/>
      <circle cx="772.5" cy="285.5" r="40.5"/>
      <circle cx="873.5" cy="285.5" r="40.5"/>
      <circle cx="974.5" cy="285.5" r="40.5"/>
      <circle cx="570.5" cy="390.5" r="40.5"/>
      <circle cx="671.5" cy="390.5" r="40.5"/>
      <circle cx="772.5" cy="390.5" r="40.5"/>
      <circle cx="873.5" cy="390.5" r="40.5"/>
    </g>
    <g class="num" text-anchor="middle" dominant-baseline="central">
      <text x="571.8" y="286.5">1</text>
      <text x="672.8" y="286.5">2</text>
      <text x="773.8" y="286.5">3</text>
      <text x="874.8" y="286.5">4</text>
      <text x="975.8" y="286.5">5</text>
      <text x="571.8" y="391.5">6</text>
      <text x="672.8" y="391.5">7</text>
      <text x="773.8" y="391.5">8</text>
      <text x="874.8" y="391.5">9</text>
    </g>
    <!-- 10th: Sage, concha line icon -->
    <g transform="translate(974.5 390.5)">
      <circle r="40.5" fill="#AEB594" stroke="#40273B" stroke-width="2"/>
      <g fill="none" stroke="#40273B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-23 11 C-24.5 -6 -13.5 -20 0 -20 C13.5 -20 24.5 -6 23 11 Z" fill="#FAF6EB"/>
        <path d="M0 11 L0 -20"/>
        <path d="M-2.5 11 C-8 0 -11 -10 -9.5 -18"/>
        <path d="M2.5 11 C8 0 11 -10 9.5 -18"/>
        <path d="M-5 11 C-13.5 4 -19 -3.5 -19 -11.5"/>
        <path d="M5 11 C13.5 4 19 -3.5 19 -11.5"/>
        <path d="M-7.5 11 C-16 8.5 -22 4 -23.5 -2"/>
        <path d="M7.5 11 C16 8.5 22 4 23.5 -2"/>
        <path d="M-28 17 L28 17"/>
      </g>
    </g>
  </svg>

  <div class="foot">
    <p class="name"><span class="lab">Name</span><span class="blank"></span></p>
    <p class="handle">@dulcemethow</p>
  </div>
</div>
</body>
</html>
