<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dulce Methow card, front</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,500&display=swap">
<style>
  body { margin: 0; }
  .card {
    position: relative;
    width: 1125px; height: 675px;
    overflow: hidden;
    background: #FAF6EB;
  }
  /* Logo badge 363 px tall, centered on x 562.5; 34 px of even padding to the frame on every side */
  .logo {
    position: absolute;
    left: 367.44px; top: 144.97px;
    width: 394.29px; height: 388.33px;
    object-fit: contain;
  }
  .frame { position: absolute; left: 0; top: 0; }
</style>
</head>
<body>
<div class="card">
  <img class="logo" src="../../logo/dulce-methow-logo.png" alt="Dulce Methow logo">
  <!-- Arch frame: double 2 px Deep Plum line, outer edge on the 110 px margin (y 110–565), concentric with the badge -->
  <svg class="frame" width="1125" height="675" viewBox="0 0 1125 675" fill="none" stroke="#40273B" stroke-width="2">
    <path d="M384.88 288.62 A177.62 177.62 0 0 1 740.12 288.62 V549.00 A15.00 15.00 0 0 1 725.12 564.00 H399.88 A15.00 15.00 0 0 1 384.88 549.00 Z"/>
    <path d="M394.88 288.62 A167.62 167.62 0 0 1 730.12 288.62 V549.00 A5.00 5.00 0 0 1 725.12 554.00 H399.88 A5.00 5.00 0 0 1 394.88 549.00 Z"/>
  </svg>
</div>
</body>
</html>
