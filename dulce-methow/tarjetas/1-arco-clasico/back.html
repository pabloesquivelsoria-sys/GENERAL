<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dulce Methow card, back</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,500&display=swap">
<style>
  /* Grid: trim margin 110 px on every side (x 110–1015, y 110–565).
     Column line at x 447; left column 110–405, right column 489–1015. */
  :root {
    --cream: #FAF6EB;
    --plum: #40273B;
    --sage: #AEB594;
    --sage-dark: #66704F;
    --lh: 43.4px;            /* 28 px × 1.55, the baseline step of the contact column */
  }
  body { margin: 0; }
  .card {
    position: relative;
    width: 1125px; height: 675px;
    overflow: hidden;
    background: var(--cream);
    color: var(--plum);
  }

  /* left column: name + role */
  .who { position: absolute; left: 110px; top: 0; width: 300px; }
  .name {
    position: absolute; left: 0; top: var(--name-top, 92px);
    margin: 0; white-space: nowrap;
    font-family: 'Playfair Display', serif;
    font-style: italic; font-weight: 400;
    font-size: 52px; line-height: 64px;
  }
  .role {
    position: absolute; left: 0; top: var(--role-top, 190px);
    margin: 0; white-space: nowrap;
    font-family: 'Playfair Display', serif;
    font-size: 24px; line-height: 30px;
    letter-spacing: 0.26em;
    text-transform: uppercase;
  }

  /* the one structural line: 2 px hairline on the column line */
  .rule {
    position: absolute; left: 446px; width: 2px;
    top: var(--rule-top, 110px); height: var(--rule-h, 150px);
    background: var(--plum);
  }

  /* right column: labelled contact lines */
  .contact {
    position: absolute; left: 489px; top: var(--contact-top, 98px);
    margin: 0; padding: 0; list-style: none;
    font-family: 'Lora', serif;
    font-size: 28px; line-height: var(--lh);
    white-space: nowrap;
  }
  .contact li { display: flex; align-items: baseline; }
  .contact .k {
    flex: 0 0 60px;
    font-family: 'Lora', serif; font-weight: 500;
    font-size: 24px; letter-spacing: 0.2em;
    color: var(--sage-dark);
  }

  /* bottom margin: tagline spanning the full measure, the sprig is its only ornament */
  .tagline {
    position: absolute; left: 110px; right: 110px; top: var(--tag-top, 532px);
    display: flex; align-items: center; justify-content: space-between;
    font-family: 'Playfair Display', serif;
    font-size: 24px; line-height: 30px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  /* remove the trailing tracking so the last letter sits exactly on the right margin */
  .tagline .end { margin-right: -0.22em; }
  .tagline svg { flex: 0 0 auto; display: block; }
</style>
</head>
<body>
<div class="card">
  <div class="who">
    <p class="name">Owner Name</p>
    <p class="role">Baker &amp; Owner</p>
  </div>

  <div class="rule"></div>

  <ul class="contact">
    <li><span class="k">T</span><span>(509) 555-0123</span></li>
    <li><span class="k">E</span><span>hello@dulcemethow.com</span></li>
    <li><span class="k">IG</span><span>@dulcemethow</span></li>
    <li><span class="k">A</span><span>Riverside Ave · Winthrop, WA 98862</span></li>
  </ul>

  <div class="tagline">
    <span>Mexican sweet bread &amp; desserts</span>
    <svg width="32" height="22" viewBox="0 0 32 22" aria-hidden="true">
      <!-- three-leaf sprig, as in the logo -->
      <path d="M16 20 C11.5 15 11.5 7 16 1.5 C20.5 7 20.5 15 16 20 Z" fill="#AEB594"/>
      <path d="M15 20.5 C10 21.5 4 19 1 13.5 C6.5 11.5 12.5 14.5 15 20.5 Z" fill="#AEB594"/>
      <path d="M17 20.5 C22 21.5 28 19 31 13.5 C25.5 11.5 19.5 14.5 17 20.5 Z" fill="#AEB594"/>
    </svg>
    <span class="end">Methow Valley</span>
  </div>
</div>
</body>
</html>
