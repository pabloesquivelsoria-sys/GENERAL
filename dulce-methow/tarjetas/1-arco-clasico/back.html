<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dulce Methow card, back</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,500&display=swap">
<style>
  body { margin: 0; }
  .card {
    position: relative;
    width: 1125px; height: 675px;
    overflow: hidden;
    background: #FAF6EB;
    color: #40273B;
  }
  .contact {
    position: absolute;
    left: 120px; top: 118px;
    width: 560px;
  }
  .name {
    font-family: 'Playfair Display', serif;
    font-style: italic; font-weight: 400;
    font-size: 54px; line-height: 1.1;
    margin: 0;
  }
  .role {
    font-family: 'Playfair Display', serif;
    font-size: 26px; line-height: 1;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    margin: 12px 0 34px;
  }
  .lines {
    font-family: 'Lora', serif;
    font-size: 32px; line-height: 46px;
    margin: 0; padding: 0; list-style: none;
  }
  .sprig { display: block; margin: 26px 0 22px; }
  .cta {
    font-family: 'Playfair Display', serif;
    font-style: italic; font-weight: 400;
    font-size: 38px; line-height: 1.1;
    margin: 0;
  }
  .emblem { position: absolute; left: 0; top: 0; }
</style>
</head>
<body>
<div class="card">
  <div class="contact">
    <p class="name">[Owner name]</p>
    <div class="role">Baker &amp; owner</div>
    <ul class="lines">
      <li>[phone]</li>
      <li>[email]</li>
      <li>@dulcemethow</li>
      <li>[address] · Winthrop, WA</li>
    </ul>
    <!-- sage leaf sprig divider -->
    <svg class="sprig" width="300" height="30" viewBox="0 0 300 30" fill="none">
      <line x1="0" y1="18" x2="118" y2="18" stroke="#40273B" stroke-width="1.4"/>
      <line x1="182" y1="18" x2="300" y2="18" stroke="#40273B" stroke-width="1.4"/>
      <!-- center leaf -->
      <path d="M150 26 C141 17 142 7 150 1 C158 7 159 17 150 26 Z" fill="#AEB594"/>
      <!-- side leaves -->
      <path d="M148 26 C140 27 130 23 126 15 C135 12 144 17 148 26 Z" fill="#AEB594"/>
      <path d="M152 26 C160 27 170 23 174 15 C165 12 156 17 152 26 Z" fill="#AEB594"/>
      <circle cx="150" cy="27.5" r="2" fill="#40273B"/>
    </svg>
    <p class="cta">Pre-order by message</p>
  </div>

  <!-- small arch emblem echoing the front, with a concha that turns into mountain peaks -->
  <svg class="emblem" width="1125" height="675" viewBox="0 0 1125 675" fill="none" stroke="#40273B" stroke-linecap="round" stroke-linejoin="round">
    <!-- double arch: outer x 810–990, top 150, bottom 525 -->
    <path d="M810 525 V240 A90 90 0 0 1 990 240 V525 Z" stroke-width="2.4"/>
    <path d="M819 516 V240 A81 81 0 0 1 981 240 V516 Z" stroke-width="1.3"/>

    <!-- sun with fine rays -->
    <circle cx="900" cy="250" r="9" fill="#AEB594" stroke-width="1.6"/>
    <g stroke-width="1.2">
      <line x1="900" y1="232" x2="900" y2="222"/>
      <line x1="887" y1="237" x2="881" y2="229"/>
      <line x1="913" y1="237" x2="919" y2="229"/>
      <line x1="882" y1="250" x2="872" y2="250"/>
      <line x1="918" y1="250" x2="928" y2="250"/>
    </g>

    <!-- soft hills behind the bun -->
    <path d="M820 420 C845 398 868 394 890 404" stroke-width="1.3"/>
    <path d="M910 404 C932 394 955 398 980 420" stroke-width="1.3"/>

    <!-- concha dome -->
    <path d="M840 440 C840 352 870 300 900 300 C930 300 960 352 960 440 Z" fill="#FAF6EB" stroke-width="2"/>
    <!-- scored lines rising into three peaks -->
    <path d="M846 388 L868 346 L884 368 L900 322 L916 368 L932 346 L954 388" stroke-width="1.7"/>
    <path d="M900 440 C899 400 900 360 900 322" stroke-width="1.3"/>
    <path d="M888 440 C884 412 878 378 868 346" stroke-width="1.3"/>
    <path d="M912 440 C916 412 922 378 932 346" stroke-width="1.3"/>
    <path d="M874 440 C866 420 856 404 846 388" stroke-width="1.3"/>
    <path d="M926 440 C934 420 944 404 954 388" stroke-width="1.3"/>

    <!-- base line -->
    <line x1="832" y1="440" x2="968" y2="440" stroke-width="1.6"/>

    <!-- tiny label inside the arch base -->
  </svg>
</div>
</body>
</html>
