<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dulce Methow card, back</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,500&display=swap">
<style>
  body { margin: 0; }
  .card {
    position: relative;
    width: 1125px; height: 675px;
    overflow: hidden;
    background: #FAF6EB;
    color: #40273B;
  }
  .contact {
    position: absolute;
    left: 120px; top: 118px;
    width: 560px;
  }
  .name {
    font-family: 'Playfair Display', serif;
    font-style: italic; font-weight: 400;
    font-size: 54px; line-height: 1.1;
    margin: 0;
  }
  .role {
    font-family: 'Playfair Display', serif;
    font-size: 26px; line-height: 1;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    margin: 12px 0 34px;
  }
  .lines {
    font-family: 'Lora', serif;
    font-size: 32px; line-height: 46px;
    margin: 0; padding: 0; list-style: none;
  }
  .sprig { display: block; margin: 26px 0 22px; }
  .cta {
    font-family: 'Playfair Display', serif;
    font-style: italic; font-weight: 400;
    font-size: 38px; line-height: 1.1;
    margin: 0;
  }
  .emblem { position: absolute; left: 0; top: 0; }
</style>
</head>
<body>
<div class="card">
  <div class="contact">
    <p class="name">[Owner name]</p>
    <div class="role">Baker &amp; owner</div>
    <ul class="lines">
      <li>[phone]</li>
      <li>[email]</li>
      <li>@dulcemethow</li>
      <li>[address] · Winthrop, WA</li>
    </ul>
    <!-- sage leaf sprig divider -->
    <svg class="sprig" width="300" height="30" viewBox="0 0 300 30" fill="none">
      <line x1="0" y1="18" x2="118" y2="18" stroke="#40273B" stroke-width="1.4"/>
      <line x1="182" y1="18" x2="300" y2="18" stroke="#40273B" stroke-width="1.4"/>
      <!-- center leaf -->
      <path d="M150 26 C141 17 142 7 150 1 C158 7 159 17 150 26 Z" fill="#AEB594"/>
      <!-- side leaves -->
      <path d="M148 26 C140 27 130 23 126 15 C135 12 144 17 148 26 Z" fill="#AEB594"/>
      <path d="M152 26 C160 27 170 23 174 15 C165 12 156 17 152 26 Z" fill="#AEB594"/>
      <circle cx="150" cy="27.5" r="2" fill="#40273B"/>
    </svg>
    <p class="cta">Pre-order by message</p>
  </div>

  <!-- small arch emblem echoing the front: double arch, sun, hills, pines, concha whose scored lines become peaks -->
  <svg class="emblem" width="1125" height="675" viewBox="0 0 1125 675" fill="none" stroke="#40273B" stroke-linecap="round" stroke-linejoin="round">
    <defs>
      <clipPath id="inside"><path d="M799 471 V300 A101 101 0 0 1 1001 300 V471 Z"/></clipPath>
    </defs>
    <g clip-path="url(#inside)">
      <!-- soft sage hills -->
      <path d="M795 408 C830 386 870 388 905 410 C935 392 970 388 1005 404 V444 H795 Z" fill="#AEB594" stroke="none"/>
      <path d="M795 426 C830 412 860 414 880 424" stroke-width="1.1"/>
      <path d="M1005 424 C970 412 940 414 920 424" stroke-width="1.1"/>
    </g>
    <!-- slim pines -->
    <g fill="#40273B" stroke="none">
      <path d="M817 372 L825 386 H821 L828 398 H822 L829 410 H805 L812 398 H806 L813 386 H809 Z"/>
      <rect x="816" y="410" width="2" height="7"/>
      <path d="M983 380 L990 392 H987 L993 403 H988 L994 414 H972 L978 403 H973 L979 392 H976 Z"/>
      <rect x="982" y="414" width="2" height="6"/>
    </g>

    <!-- double arch: outer x 790–1010, top 190, bottom 480 -->
    <path d="M790 480 V300 A110 110 0 0 1 1010 300 V480 Z" stroke-width="2.4"/>
    <path d="M799 471 V300 A101 101 0 0 1 1001 300 V471 Z" stroke-width="1.3"/>

    <!-- sun with fine rays -->
    <circle cx="900" cy="300" r="9" fill="#AEB594" stroke-width="1.6"/>
    <g stroke-width="1.2">
      <line x1="900" y1="284" x2="900" y2="272"/>
      <line x1="888" y1="288" x2="881" y2="279"/>
      <line x1="912" y1="288" x2="919" y2="279"/>
      <line x1="878" y1="298" x2="868" y2="295"/>
      <line x1="922" y1="298" x2="932" y2="295"/>
    </g>

    <!-- concha dome on the horizon -->
    <path d="M836 444 A70 70 0 1 1 964 444 Z" fill="#FAF6EB" stroke-width="2"/>
    <!-- scored lines rising into three peaks -->
    <path d="M831 425 L866 386 L882 404 L900 364 L918 404 L934 386 L969 425" stroke-width="1.7"/>
    <path d="M900 444 C900 417 900 392 900 364" stroke-width="1.3"/>
    <path d="M884 444 C878 422 872 404 866 386" stroke-width="1.3"/>
    <path d="M916 444 C922 422 928 404 934 386" stroke-width="1.3"/>
    <path d="M866 444 C856 438 842 432 831 425" stroke-width="1.3"/>
    <path d="M934 444 C944 438 958 432 969 425" stroke-width="1.3"/>

    <!-- horizon line -->
    <line x1="799" y1="444" x2="1001" y2="444" stroke-width="1.6"/>
  </svg>
</div>
</body>
</html>
