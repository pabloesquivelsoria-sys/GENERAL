<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dulce Methow · Front</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,500&display=swap">
<style>
  body{margin:0}
  .card{position:relative;width:1125px;height:675px;overflow:hidden;background:#40273B}
  /* arch outline, 2 px, offset 14 px around the panel */
  .outline{position:absolute;left:378.5px;top:102px;width:368px;height:471px;box-sizing:border-box;
           border:2px solid #FAF6EB;border-radius:184px 184px 32px 32px / 184px 184px 32px 32px}
  /* cream arch panel, same silhouette as the badge */
  .panel{position:absolute;left:392.5px;top:116px;width:340px;height:443px;background:#FAF6EB;
         border-radius:170px 170px 18px 18px / 170px 170px 18px 18px}
  /* logo: badge area 891x1218 of the 1323x1303 file, shown at 280 px wide (383 px tall) */
  .logo{position:absolute;left:30px;top:30px;width:280px;height:383px;overflow:hidden}
  .logo img{position:absolute;left:-65.68px;top:-11.63px;width:415.75px;height:409.47px;object-fit:contain;display:block}
</style>
</head>
<body>
<div class="card">
  <div class="outline"></div>
  <div class="panel">
    <div class="logo"><img src="../../logo/dulce-methow-logo.png" alt="Dulce Methow"></div>
  </div>
</div>
</body>
</html>
