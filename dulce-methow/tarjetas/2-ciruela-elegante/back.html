<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dulce Methow · Back</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,500&display=swap">
<style>
  body{margin:0}
  .card{position:relative;width:1125px;height:675px;overflow:hidden;background:#FAF6EB;color:#40273B}
  .band{position:absolute;left:0;top:0;width:375px;height:675px;background:#CDBED2}
  .band svg{position:absolute;left:57.5px;top:199px;width:260px;height:240px}
  .info{position:absolute;left:455px;top:100px;width:595px}
  .name{font-family:'Playfair Display',serif;font-style:italic;font-weight:400;font-size:54px;line-height:64px;margin:0}
  .role{font-family:'Lora',serif;font-size:26px;letter-spacing:0.3em;text-transform:uppercase;line-height:34px;margin:8px 0 0}
  .rule{width:64px;height:1.5px;background:#40273B;margin:26px 0 24px}
  .lines{font-family:'Lora',serif;font-size:32px;line-height:46px;margin:0;padding:0;list-style:none}
  .cta{position:absolute;left:455px;top:520px;width:595px;font-family:'Lora',serif;font-style:italic;font-size:30px;line-height:40px;
       padding-top:18px;border-top:1.5px solid #40273B}
</style>
</head>
<body>
<div class="card">
  <div class="band">
    <svg viewBox="0 0 260 240" fill="none" stroke="#40273B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-label="Concha with mountain peaks">
      <!-- sun with fine rays -->
      <circle cx="130" cy="36" r="10"/>
      <path d="M130 8v12 M108 15l7 9 M152 15l-7 9 M96 32h12 M164 32h-12 M100 46l9 -4 M160 46l-9 -4" stroke-width="1.8"/>
      <!-- concha outline -->
      <path d="M18 204 C2 150 38 72 130 68 C222 72 258 150 242 204 Q130 222 18 204 Z"/>
      <!-- scored lines that become three peaks -->
      <path d="M28 160 L80 104 L105 134 L130 86 L155 134 L180 104 L232 160"/>
      <!-- second, finer scoring echoing the peaks -->
      <path d="M44 140 L80 98 L105 126 L130 80 L155 126 L180 98 L216 140" stroke-width="1.4"/>
      <!-- snow notches -->
      <path d="M72 113 l8 5 l7 -6 M121 99 l9 6 l9 -6 M173 112 l7 6 l8 -5" stroke-width="1.8"/>
      <!-- fan scoring from peaks to base -->
      <path d="M28 160 Q30 192 48 208"/>
      <path d="M80 104 Q62 160 76 211"/>
      <path d="M105 134 Q96 178 104 213"/>
      <path d="M130 86 V214"/>
      <path d="M155 134 Q164 178 156 213"/>
      <path d="M180 104 Q198 160 184 211"/>
      <path d="M232 160 Q230 192 212 208"/>
      <!-- ground line -->
      <path d="M4 226 H256" stroke-width="1.4"/>
    </svg>
  </div>

  <div class="info">
    <p class="name">[Owner name]</p>
    <p class="role">Baker &amp; owner</p>
    <div class="rule"></div>
    <ul class="lines">
      <li>[phone]</li>
      <li>[email]</li>
      <li>@dulcemethow</li>
      <li>[address] · Winthrop, WA</li>
    </ul>
  </div>

  <div class="cta">Pre-order by message</div>
</div>
</body>
</html>
