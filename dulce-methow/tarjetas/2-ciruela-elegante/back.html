<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dulce Methow · Back</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,500&display=swap">
<style>
  body{margin:0}
  .card{position:relative;width:1125px;height:675px;overflow:hidden;background:#FAF6EB;color:#40273B}
  /* double frame: outer on the 75 px safe line, inner 8 px inside */
  .frame{position:absolute;box-sizing:border-box;border:2px solid #40273B}
  .f1{left:75px;top:75px;width:975px;height:525px}
  .f2{left:85px;top:85px;width:955px;height:505px}
  .content{position:absolute;left:110px;top:110px;width:905px;height:455px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .dulce{font-family:'Playfair Display',serif;font-style:italic;font-weight:400;font-size:64px;line-height:64px;margin:0}
  .methow{font-family:'Playfair Display',serif;font-weight:400;font-size:26px;line-height:30px;letter-spacing:0.4em;padding-left:0.4em;text-transform:uppercase;margin:6px 0 0}
  .sprig{display:block;width:52px;height:31px;margin:20px 0 20px}
  .name{font-family:'Playfair Display',serif;font-style:italic;font-weight:400;font-size:36px;line-height:42px;margin:0}
  .role{font-family:'Lora',serif;font-size:24px;line-height:30px;letter-spacing:0.26em;padding-left:0.26em;text-transform:uppercase;margin:6px 0 0}
  .contact{font-family:'Lora',serif;font-size:28px;line-height:1.55;margin:22px 0 0;padding:0;list-style:none}
</style>
</head>
<body>
<div class="card">
  <div class="frame f1"></div>
  <div class="frame f2"></div>
  <div class="content">
    <p class="dulce">dulce</p>
    <p class="methow">Methow</p>
    <svg class="sprig" viewBox="0 0 44 26" aria-hidden="true">
      <path fill="#AEB594" d="M22 2 C28 8 28 16 22 22 C16 16 16 8 22 2 Z"/>
      <path fill="#AEB594" d="M20 22 C14 24 6 22 2 15 C9 12 16 15 20 22 Z"/>
      <path fill="#AEB594" d="M24 22 C30 24 38 22 42 15 C35 12 28 15 24 22 Z"/>
    </svg>
    <p class="name">Owner Name</p>
    <p class="role">Baker &amp; Owner</p>
    <ul class="contact">
      <li>(509) 555-0123 · hello@dulcemethow.com</li>
      <li>@dulcemethow</li>
      <li>Riverside Ave · Winthrop, WA 98862</li>
    </ul>
  </div>
</div>
</body>
</html>
