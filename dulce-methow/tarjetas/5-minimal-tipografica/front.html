<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dulce Methow · Front</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,500&display=swap">
<style>
  body{margin:0}
  .card{position:relative;width:1125px;height:675px;overflow:hidden;background:#CDBED2;color:#40273B}
  /* margin line: x = 110 px; bottom line: y = 565 px */
  .mark{position:absolute;left:110px;top:150px}
  .dulce{display:block;font-family:'Playfair Display',serif;font-style:italic;font-weight:400;font-size:260px;line-height:1;letter-spacing:-0.012em;margin:0 0 0 var(--dx,0px)}
  .methow{display:block;font-family:'Playfair Display',serif;font-weight:400;font-size:30px;line-height:1;letter-spacing:0.45em;margin:22px 0 0 var(--mx,0px)}
  .foot{position:absolute;left:110px;right:110px;bottom:110px;display:flex;justify-content:space-between;align-items:baseline;
        font-family:'Playfair Display',serif;font-weight:400;font-size:24px;line-height:1;letter-spacing:0.22em;text-transform:uppercase}
  .foot span:last-child{margin-right:-0.22em}
</style>
</head>
<body>
<div class="card">
  <div class="mark">
    <span class="dulce">dulce</span>
    <span class="methow">METHOW</span>
  </div>
  <div class="foot">
    <span>Mexican sweet bread &amp; desserts</span>
    <span>Winthrop, WA</span>
  </div>
</div>
</body>
</html>
