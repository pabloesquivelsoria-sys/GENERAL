<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dulce Methow · Front</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,500&display=swap">
<style>
  body{margin:0}
  .card{position:relative;width:1125px;height:675px;overflow:hidden;background:#CDBED2;color:#40273B}
  .mark{position:absolute;left:150px;top:185px}
  .dulce{font-family:'Playfair Display',serif;font-style:italic;font-weight:400;font-size:200px;line-height:1;letter-spacing:-0.01em;margin:0}
  .methow{font-family:'Playfair Display',serif;font-weight:400;font-size:30px;letter-spacing:0.45em;margin:18px 0 0 10px}
  .place{position:absolute;right:75px;bottom:75px;font-family:'Lora',serif;font-size:26px;letter-spacing:0.04em;line-height:1}
  .icon{position:absolute;right:82px;top:82px;width:112px;height:84px}
</style>
</head>
<body>
<div class="card">
  <svg class="icon" viewBox="0 0 100 75" fill="none" stroke="#40273B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <!-- concha dome -->
    <path d="M10 64 A40 40 0 0 1 90 64"/>
    <path d="M6 64 H94"/>
    <!-- scored lines rising into peaks -->
    <path d="M17 52 L32 38 L42 49 L53 30 L64 46 L73 37 L84 52"/>
    <path d="M32 38 L28 64 M53 30 L50 64 M73 37 L72 64"/>
    <path d="M42 49 L39 64 M64 46 L61 64"/>
    <!-- tiny sun -->
    <circle cx="50" cy="13" r="3.2"/>
  </svg>

  <div class="mark">
    <p class="dulce">dulce</p>
    <p class="methow">METHOW</p>
  </div>

  <div class="place">Winthrop, WA</div>
</div>
</body>
</html>
