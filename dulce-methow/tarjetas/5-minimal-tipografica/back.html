<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dulce Methow · Back</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,500&display=swap">
<style>
  body{margin:0}
  .card{position:relative;width:1125px;height:675px;overflow:hidden;background:#FAF6EB;color:#40273B}
  .logo{position:absolute;left:115px;top:227px;width:220px;height:217px;object-fit:contain}
  .info{position:absolute;left:440px;top:120px;width:560px;display:grid;grid-template-columns:1fr;row-gap:0}
  .name{font-family:'Playfair Display',serif;font-style:italic;font-weight:400;font-size:50px;line-height:1.1;margin:0}
  .role{font-family:'Playfair Display',serif;font-size:26px;letter-spacing:0.32em;text-transform:uppercase;margin:12px 0 0}
  .rule{height:0;border-top:2px solid #AEB594;width:120px;margin:30px 0 30px}
  .lines{display:grid;grid-template-columns:1fr;row-gap:12px;font-family:'Lora',serif;font-size:31px;line-height:1.2}
  .cta{position:absolute;left:440px;bottom:110px;font-family:'Playfair Display',serif;font-style:italic;font-size:32px;line-height:1}
</style>
</head>
<body>
<div class="card">
  <img class="logo" src="../../logo/dulce-methow-logo.png" alt="Dulce Methow logo">

  <div class="info">
    <p class="name">[Owner name]</p>
    <p class="role">Baker &amp; owner</p>
    <div class="rule"></div>
    <div class="lines">
      <div>[phone]</div>
      <div>[email]</div>
      <div>@dulcemethow</div>
      <div>[address] · Winthrop, WA</div>
    </div>
  </div>

  <div class="cta">Pre-order by message</div>
</div>
</body>
</html>
