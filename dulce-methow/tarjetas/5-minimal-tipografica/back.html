<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dulce Methow · Back</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,500&display=swap">
<style>
  body{margin:0}
  .card{position:relative;width:1125px;height:675px;overflow:hidden;background:#40273B;color:#FAF6EB}
  /* margin: 110 px on every side */
  .who{position:absolute;left:110px;top:100px}
  .name{font-family:'Playfair Display',serif;font-style:italic;font-weight:400;font-size:52px;line-height:1.1;margin:0}
  .role{font-family:'Playfair Display',serif;font-weight:400;font-size:24px;line-height:1;letter-spacing:0.26em;text-transform:uppercase;margin:16px 0 0}
  .contact{position:absolute;left:110px;bottom:97px;display:grid;grid-template-columns:60px auto;align-items:baseline;
           font-family:'Lora',serif;font-size:29px;line-height:1.55}
  .contact dt{font-family:'Playfair Display',serif;font-size:24px;letter-spacing:0.1em;text-transform:uppercase;color:#CDBED2}
  .contact dd{margin:0}
  dl{margin:0}
  .icon{position:absolute;right:110px;bottom:109px;width:90px;height:50px;overflow:visible}
</style>
</head>
<body>
<div class="card">
  <div class="who">
    <p class="name">Owner Name</p>
    <p class="role">Baker &amp; Owner</p>
  </div>

  <dl class="contact">
    <dt>T</dt><dd>(509) 555-0123</dd>
    <dt>E</dt><dd>hello@dulcemethow.com</dd>
    <dt>IG</dt><dd>@dulcemethow</dd>
    <dt>A</dt><dd>Riverside Ave · Winthrop, WA 98862</dd>
  </dl>

  <!-- concha-mountain line icon, drawn in pixel units so the stroke is exactly 2 px -->
  <svg class="icon" viewBox="0 0 90 50" fill="none" stroke="#FAF6EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M2 49 A43 43 0 0 1 88 49"/>
    <path d="M0 49 H90"/>
    <path d="M4.6 35 L22 19 L33 29 L45 11 L57 29 L68 19 L85.4 35"/>
    <path d="M33 29 Q35 41 40 49 M57 29 Q55 41 50 49"/>
  </svg>
</div>
</body>
</html>
