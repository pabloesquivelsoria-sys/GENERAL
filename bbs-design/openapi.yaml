openapi: 3.0.3
info:
  title: BBS API - Behavior-Based Safety
  version: 1.0.0
  description: |-
    Contrato de la API del sistema BBS (EHS). Ciclo: Observacion -> Alerta -> CAPA -> Verificacion.

    **Alineacion con la base de datos**: los nombres JSON son los nombres de columna (snake_case) de
    `bbs-system/db/migrations/*.sql`; los enums son exactamente los tipos `CREATE TYPE` de la migracion 001.
    Si el documento de diseno (UX.md/ARQUITECTURA.md) difiere (p. ej. `pending_verification`, `reopened`),
    manda el esquema SQL: el estado CAPA es `verification` y una verificacion no efectiva devuelve la CAPA a `in_progress`.

    Convenciones: fechas-hora ISO-8601 UTC (`date-time`), fechas de vencimiento `date`; listas paginadas con
    `page`/`limit` (max 100) y envoltorio `{data, meta:{page,limit,total,pages}}`; errores con el formato estandar de NestJS.
    Autenticacion: `Authorization: Bearer <JWT>` (access token corto) salvo rutas marcadas como publicas.
    Los `reference` (`OBS-YYYY-000001`, `NM-...`, `CAPA-...`) los genera la base de datos.


    **Estado de implementacion** (`x-implementation` en cada operacion): `implemented` = existe en `bbs-system/api` (auth, observations, near-misses, capa, alerts, kpi, health; verificado contra controllers y DTOs); `planned` = contrato de diseno aun sin implementar (webhooks de integracion y suscripciones salientes).
    El esquema del cuerpo de `POST /webhooks/traccar` conserva los nombres camelCase de Traccar.
  license:
    name: Proprietary
servers:
- url: http://localhost:3000/api/v1
  description: Desarrollo / integracion
- url: https://bbs.example.com/api/v1
  description: Produccion
tags:
- name: Auth
  description: Sesion, registro y gestion de roles
- name: Observations
- name: Near-misses
- name: CAPA
- name: Alerts
- name: KPI
- name: Integrations
  description: Webhooks entrantes y suscripciones salientes
security:
- bearerAuth: []
paths:
  /auth/login:
    post:
      tags:
      - Auth
      operationId: login
      summary: Iniciar sesion
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Token emitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      description: JWT con claims `sub`, `email`, `roles[]`; expira segun `JWT_EXPIRES_IN` (defecto 8h). No hay
        refresh token en esta version.
      x-implementation: implemented
  /auth/register:
    post:
      tags:
      - Auth
      operationId: register
      summary: Auto-registro
      security: []
      description: Publico salvo `ALLOW_SELF_REGISTER=false`. El **primer usuario** del sistema recibe el rol `admin`
        (bootstrap); los siguientes entran como `observer`. Devuelve ya un token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '409': &id006
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'
      x-implementation: implemented
  /auth/me:
    get:
      tags:
      - Auth
      operationId: getMe
      summary: Usuario autenticado
      responses:
        '200':
          description: Perfil con roles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-implementation: implemented
  /observations:
    get:
      tags:
      - Observations
      operationId: listObservations
      summary: Listar observaciones
      description: 'Filtros por sitio, area, observador, estado, rango y presencia de comportamientos de riesgo.
        Orden: `observed_at` desc.'
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: site_id
        in: query
        schema:
          type: string
          format: uuid
      - name: area_id
        in: query
        schema:
          type: string
          format: uuid
      - name: observer_id
        in: query
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/ObservationStatus'
      - name: has_at_risk
        in: query
        description: Solo con algun item at_risk
        schema:
          type: boolean
      - name: from
        in: query
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Pagina de observaciones
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PageMeta'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/ObservationSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-implementation: implemented
    post:
      tags:
      - Observations
      operationId: createObservation
      summary: Crear observacion
      description: Crea observacion e items en una transaccion (actor registrado para auditoria). Si no es borrador,
        genera por cada item `at_risk` una alerta `unsafe_behavior` (critica si el item es critico en el checklist)
        y `repeat_unsafe_behavior` si se alcanza `REPEAT_UNSAFE_THRESHOLD` (3) en `REPEAT_UNSAFE_WINDOW_DAYS` (30)
        para el mismo comportamiento y area.
      x-roles:
      - observer
      - supervisor
      - ehs_manager
      - site_manager
      responses:
        '201':
          description: Creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Observation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObservationCreate'
      x-implementation: implemented
  /observations/{id}:
    parameters:
    - $ref: '#/components/parameters/IdPath'
    get:
      tags:
      - Observations
      operationId: getObservation
      summary: Detalle de observacion
      responses:
        '200':
          description: Observacion con items y adjuntos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Observation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-implementation: implemented
  /near-misses:
    get:
      tags:
      - Near-misses
      operationId: listNearMisses
      summary: Listar near-misses
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: site_id
        in: query
        schema:
          type: string
          format: uuid
      - name: area_id
        in: query
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/NearMissStatus'
      - name: potential_severity
        in: query
        schema:
          $ref: '#/components/schemas/SeverityLevel'
      - name: from
        in: query
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Pagina de near-misses
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PageMeta'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/NearMissSummary'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
      x-implementation: implemented
    post:
      tags:
      - Near-misses
      operationId: createNearMiss
      summary: Reportar near-miss
      description: '`is_anonymous=true` => `reported_by=null`. `potential_severity` defecto `medium`. `risk_score`
        lo calcula la BD (severidad 1..4 x likelihood 1..5). Genera alerta `near_miss_reported`.'
      x-roles:
      - observer
      - supervisor
      - ehs_manager
      - site_manager
      - capa_owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NearMissCreate'
      responses:
        '201':
          description: Reportado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NearMiss'
        '400': *id001
        '401': *id002
        '403': *id003
      x-implementation: implemented
  /near-misses/{id}:
    parameters:
    - $ref: '#/components/parameters/IdPath'
    get:
      tags:
      - Near-misses
      operationId: getNearMiss
      summary: Detalle (con factores, adjuntos y CAPAs vinculadas)
      responses:
        '200':
          description: Near-miss
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NearMiss'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-implementation: implemented
    patch:
      tags:
      - Near-misses
      operationId: updateNearMiss
      summary: Triage / investigacion (causa raiz, severidad, likelihood, accion inmediata, factores)
      x-roles:
      - supervisor
      - ehs_manager
      - site_manager
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NearMissUpdate'
      responses:
        '200':
          description: Actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NearMiss'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      description: No se puede editar un near-miss `closed` (409). `factor_ids` reemplaza el conjunto.
      x-implementation: implemented
  /alerts:
    get:
      tags:
      - Alerts
      operationId: listAlerts
      summary: Listar alertas
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/AlertStatus'
      - name: type
        in: query
        schema:
          $ref: '#/components/schemas/AlertType'
      - name: site_id
        in: query
        schema:
          type: string
          format: uuid
      - name: mine
        in: query
        description: 'true (defecto): solo alertas dirigidas al usuario; false: todas (solo gerentes)'
        schema:
          type: boolean
          default: true
      - name: unread
        in: query
        description: Con mine, solo sin leer
        schema:
          type: boolean
      responses:
        '200':
          description: Pagina de alertas
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PageMeta'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/Alert'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      description: 'Orden: no resueltas primero, luego mas recientes. Con `mine=true` incluye `read_at` del destinatario.'
      x-implementation: implemented
  /alerts/unread-count:
    get:
      tags:
      - Alerts
      operationId: getUnreadAlertCount
      summary: Contador de alertas sin leer del usuario (badge)
      responses:
        '200':
          description: Contador
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-implementation: implemented
  /alerts/{id}/acknowledge:
    parameters:
    - $ref: '#/components/parameters/IdPath'
    post:
      tags:
      - Alerts
      operationId: acknowledgeAlert
      summary: Acusar recibo (open -> acknowledged)
      description: Fija `acknowledgedBy/At`. Idempotente si ya esta `acknowledged` por el mismo usuario; 409 si
        `resolved`.
      responses:
        '200':
          description: Alerta acusada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'
      x-implementation: implemented
  /alerts/{id}/resolve:
    parameters:
    - $ref: '#/components/parameters/IdPath'
    post:
      tags:
      - Alerts
      operationId: resolveAlert
      summary: Resolver (open|acknowledged -> resolved)
      description: Libera la clave `dedupe_key` para futuras alertas. Las alertas ligadas a una CAPA tambien se
        resuelven solas al cerrar/cancelar la CAPA.
      x-roles:
      - supervisor
      - ehs_manager
      - site_manager
      responses:
        '200':
          description: Alerta resuelta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'
      x-implementation: implemented
  /alerts/{id}/read:
    parameters:
    - $ref: '#/components/parameters/IdPath'
    post:
      tags:
      - Alerts
      operationId: markAlertRead
      summary: Marcar como leida para el usuario actual (`alert_recipients.read_at`)
      responses:
        '200':
          description: Marcada como leida
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      x-implementation: implemented
  /webhooks/traccar:
    post:
      tags:
      - Integrations
      operationId: receiveTraccarEvent
      summary: Webhook de eventos de Traccar (event.forward.url)
      description: |-
        Traccar reenvia `geofenceEnter`, `geofenceExit`, `deviceOverspeed`, `alarm`, `deviceOffline`...
        Se autentica con `X-BBS-Webhook-Token` (o `X-BBS-Signature: sha256=<hmac>` del cuerpo crudo si se configura un secreto).
        Responde 202 de inmediato y encola el procesamiento. Deduplicacion por `traccar:{event.id}`
        (o `traccar:{deviceId}:{type}:{eventTime}`). La velocidad de Traccar viene en **nudos**.

        Resultado segun reglas: `near_miss` (se crea con `is_anonymous=true`, `reported_by=null`, descripcion con
        dispositivo/geocerca y coordenadas en `location_detail`) y/o `alert` (`near_miss_reported` o `unsafe_behavior`).
        El mapeo dispositivo->sitio/area es configuracion de integracion.


        Columnas relevantes de `near_misses`: no existen `source` ni coordenadas; el origen y lat/lng viajan en `title`/`description`/`location_detail` hasta que se agregue una migracion (ver README).
      security:
      - webhookToken: []
      - webhookSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TraccarWebhook'
            example:
              event:
                id: 98213
                type: geofenceEnter
                eventTime: '2026-10-06T14:12:07.000+00:00'
                deviceId: 17
                positionId: 5521307
                geofenceId: 4
                attributes: {}
              device:
                id: 17
                name: Montacargas MC-03
                uniqueId: '865432109876543'
                category: truck
                attributes:
                  siteCode: PLANTA-01
              position:
                id: 5521307
                deviceId: 17
                fixTime: '2026-10-06T14:12:05.000+00:00'
                latitude: -33.44891
                longitude: -70.66927
                speed: 9.7
                course: 184
                accuracy: 4
                attributes:
                  ignition: true
              geofence:
                id: 4
                name: Zona peatonal - Pasillo B
                description: pedestrian_zone
      responses:
        '202':
          description: Aceptado y encolado
          content:
            application/json:
              schema:
                type: object
                required:
                - accepted
                - deduplicated
                properties:
                  accepted:
                    type: boolean
                  deduplicated:
                    type: boolean
              example:
                accepted: true
                deduplicated: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-implementation: planned
  /webhook-subscriptions:
    get:
      tags:
      - Integrations
      operationId: listWebhookSubscriptions
      summary: Suscripciones de webhooks salientes
      x-roles:
      - admin
      responses:
        '200':
          description: Suscripciones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WebhookSubscription'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-implementation: planned
    post:
      tags:
      - Integrations
      operationId: createWebhookSubscription
      summary: Crear suscripcion
      description: 'Entrega `POST` con `X-BBS-Event`, `X-BBS-Delivery` y `X-BBS-Signature: sha256=<hmac(body, secret)>`.
        Reintentos exponenciales.'
      x-roles:
      - admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookSubscriptionCreate'
      responses:
        '201':
          description: Creada (el `secret` se muestra solo aqui)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscription'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-implementation: planned
  /webhook-subscriptions/{id}:
    parameters:
    - $ref: '#/components/parameters/IdPath'
    delete:
      tags:
      - Integrations
      operationId: deleteWebhookSubscription
      summary: Eliminar suscripcion
      x-roles:
      - admin
      responses:
        '204':
          description: Eliminada
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-implementation: planned
  /health:
    get:
      tags:
      - Auth
      operationId: health
      summary: Healthcheck (publico)
      security: []
      responses:
        '200':
          description: Servicio arriba
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
      x-implementation: implemented
  /auth/users:
    get:
      tags:
      - Auth
      operationId: listUsers
      summary: Buscar usuarios (selectores de responsable/verificador)
      x-roles:
      - ehs_manager
      - site_manager
      - supervisor
      parameters:
      - name: q
        in: query
        description: Busca en nombre y email (maximo 200 resultados, sin paginar)
        schema:
          type: string
      responses:
        '200':
          description: Usuarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserListItem'
        '401': *id002
        '403': *id003
      x-implementation: implemented
  /auth/users/{id}/roles:
    post:
      tags:
      - Auth
      operationId: assignRole
      summary: Asignar rol (opcionalmente acotado a un sitio)
      x-roles:
      - admin
      parameters:
      - &id004
        name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRoleRequest'
      responses:
        '201':
          description: Roles vigentes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRoles'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': &id005
          $ref: '#/components/responses/NotFound'
      x-implementation: implemented
  /auth/users/{id}/roles/{role}:
    delete:
      tags:
      - Auth
      operationId: revokeRole
      summary: Revocar rol
      x-roles:
      - admin
      parameters:
      - *id004
      - name: role
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/RoleCode'
      - name: site_id
        in: query
        description: Omitir para el rol global
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Roles vigentes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRoles'
        '401': *id002
        '403': *id003
      x-implementation: implemented
  /observations/catalog:
    get:
      tags:
      - Observations
      operationId: getObservationCatalog
      summary: Catalogos para el formulario de captura (cachear en cliente)
      description: Comportamientos activos con categoria, checklists activos con sus items, factores causales y
        sitios activos con sus areas.
      responses:
        '200':
          description: Catalogos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservationCatalog'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-implementation: implemented
  /observations/{id}/status:
    patch:
      tags:
      - Observations
      operationId: changeObservationStatus
      summary: Cambiar estado de la observacion
      description: 'Transiciones: `draft -> submitted` (observador dueno o supervisor/gerente; dispara alertas),
        `submitted -> reviewed|archived`, `reviewed -> archived` (solo supervisor/ehs_manager/site_manager/admin).
        `archived` es terminal. Otra combinacion: 409.'
      x-roles:
      - observer
      - supervisor
      - ehs_manager
      - site_manager
      parameters:
      - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - status
              properties:
                status:
                  $ref: '#/components/schemas/ObservationStatus'
      responses:
        '200':
          description: Observacion actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Observation'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id005
        '409': *id006
      x-implementation: implemented
  /near-misses/{id}/status:
    post:
      tags:
      - Near-misses
      operationId: changeNearMissStatus
      summary: Cambiar estado del near-miss
      description: |-
        Transiciones (mismas que el servicio):

        ```mermaid
        stateDiagram-v2
          [*] --> reported
          reported --> under_investigation
