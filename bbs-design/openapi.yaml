components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT con claims `sub` (userId), `email`, `roles[]` (RoleCode). `admin` pasa siempre los chequeos
        de rol.
    webhookToken:
      type: apiKey
      in: header
      name: X-BBS-Webhook-Token
      description: Token compartido para webhooks entrantes
    webhookSignature:
      type: apiKey
      in: header
      name: X-BBS-Signature
      description: HMAC SHA-256 del cuerpo crudo, formato `sha256=<hex>`
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  requestBodies: {}
  responses:
    BadRequest:
      description: Peticion mal formada o validacion de DTO fallida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status_code: 400
            error: Bad Request
            message:
            - email must be an email
    Unauthorized:
      description: Token ausente, invalido o expirado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status_code: 401
            error: Unauthorized
            message: Token requerido
    Forbidden:
      description: Rol insuficiente o fuera de alcance de sitio
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status_code: 403
            error: Forbidden
            message: Rol insuficiente
    NotFound:
      description: Recurso inexistente (o fuera de alcance)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflicto (duplicado, estado incompatible)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidTransition:
      description: Transicion de estado no permitida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status_code: 409
            error: Conflict
            code: INVALID_TRANSITION
            message: No se puede pasar de open a verification
    Unprocessable:
      description: Regla de negocio o restriccion de datos violada (CHECK de SQL)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status_code: 422
            error: Unprocessable Entity
            code: BUSINESS_RULE
            message: El verificador debe ser distinto del responsable
    PayloadTooLarge:
      description: Cuerpo o archivo demasiado grande
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Limite de tasa excedido
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    BehaviorResult:
      type: string
      enum:
      - safe
      - at_risk
      - not_applicable
    ObservationStatus:
      type: string
      enum:
      - draft
      - submitted
      - reviewed
      - archived
    SeverityLevel:
      type: string
      enum:
      - low
      - medium
      - high
      - critical
    PriorityLevel:
      type: string
      enum:
      - low
      - medium
      - high
      - critical
    NearMissStatus:
      type: string
      enum:
      - reported
      - under_investigation
      - capa_assigned
      - closed
    CapaType:
      type: string
      enum:
      - corrective
      - preventive
      - containment
    CapaStatus:
      type: string
      enum:
      - open
      - in_progress
      - verification
      - closed
      - cancelled
    CapaSource:
      type: string
      enum:
      - observation
      - near_miss
      - audit
      - other
    HierarchyControl:
      type: string
      enum:
      - elimination
      - substitution
      - engineering
      - administrative
      - ppe
    AlertStatus:
      type: string
      enum:
      - open
      - acknowledged
      - resolved
    AlertType:
      type: string
      enum:
      - unsafe_behavior
      - repeat_unsafe_behavior
      - near_miss_reported
      - capa_due_soon
      - capa_overdue
      - capa_escalated
      - verification_pending
    AlertEntityType:
      type: string
      enum:
      - observation
      - near_miss
      - capa
    RoleCode:
      type: string
      enum:
      - admin
      - ehs_manager
      - site_manager
      - supervisor
      - observer
      - capa_owner
      - viewer
    Error:
      type: object
      required:
      - status_code
      - message
      properties:
        status_code:
          type: integer
        error:
          type: string
        code:
          type: string
          description: Codigo de negocio estable (INVALID_TRANSITION, BUSINESS_RULE, ...)
        message:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
    PageMeta:
      type: object
      required:
      - meta
      properties:
        meta:
          type: object
          required:
          - page
          - limit
          - total
          - pages
          properties:
            page:
              type: integer
            limit:
              type: integer
            total:
              type: integer
            pages:
              type: integer
    UserRef:
      type: object
      required:
      - id
      - full_name
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: string
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    RegisterRequest:
      type: object
      required:
      - email
      - password
      - full_name
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 10
          maxLength: 128
        full_name:
          type: string
          minLength: 2
          maxLength: 200
        employee_code:
          type: string
          maxLength: 50
        job_title:
          type: string
          maxLength: 100
        supervisor_id:
          type: string
          format: uuid
        home_site_id:
          type: string
          format: uuid
        home_area_id:
          type: string
          format: uuid
    User:
      type: object
      description: Respuesta de GET /auth/me
      required:
