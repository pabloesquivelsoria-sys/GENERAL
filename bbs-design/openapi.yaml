      summary: Cambiar estado de la CAPA
      description: |-
        Maquina de estados (enum SQL `capa_status`; ver `capa.state-machine.ts`):

        ```mermaid
        stateDiagram-v2
          [*] --> open
          open --> in_progress
          in_progress --> verification
          verification --> closed: POST /verifications is_effective=true
          verification --> in_progress: rechazo o verificacion no efectiva
          open --> cancelled
          in_progress --> cancelled
          verification --> cancelled
          closed --> [*]
          cancelled --> [*]
        ```

        | Desde | Hacia | Quien | Reglas |
        |---|---|---|---|
        | open | in_progress | owner, creador o gerente | fija `started_at` |
        | in_progress | verification | owner o gerente | `comment` obligatorio (evidencia de implementacion); exige `verifier_id` asignado (400); fija `submitted_for_verification_at`; alerta `verification_pending` |
        | verification | in_progress | verificador o gerente | `comment` obligatorio (rechazo) |
        | open, in_progress, verification | cancelled | gerente (`ehs_manager`/`site_manager`/`admin`) | `comment` obligatorio (motivo, se guarda en `cancelled_reason`) |
        | verification | closed | **solo** `POST /capa/{id}/verifications` | `to=closed` aqui devuelve 400 |

        Otra combinacion: 409 `Transicion invalida`. Cada transicion crea una fila en `capa_updates` y una auditoria `TRANSITION`; al cerrar/cancelar se resuelven las alertas de la CAPA.
